name: pr-test

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: pr-test-${{ github.ref }}
  cancel-in-progress: true

env:
  MAX_JOBS: "32"

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk_tag: 2604
            aicc_major: "1.0.0"
            pip_index_suffix: nightly/dtk2604/+simple/
            torch_version: "2.11.0"
            need_vllm: false
          - dtk_tag: 2610
            aicc_major: "2.0.0"
            pip_index_suffix: nightly/dtk2610/+simple/
            torch_version: "2.11.0"
            need_vllm: true
    env:
      TORCH_VERSION: ${{ matrix.torch_version }}
      DTK_TAG: ${{ matrix.dtk_tag }}
    container:
      # DTK 基础镜像, 自带 /opt/dtk
      image: 10.16.1.152:5000/hcu/base/dtk:${{ matrix.dtk_tag == '2610' && '26.10' || '26.04' }}-rockylinux8.6-py3.12
      options: >-
        --volume /opt/hyhal:/opt/hyhal:ro
        --device /dev/kfd:/dev/kfd
        --device /dev/dri:/dev/dri
        --cap-add=SYS_PTRACE
        --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 合入最新 master
        if: matrix.dtk_tag != '2610'
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          target_sha="$(git rev-parse origin/master)"
          git -c user.name='LightOp CI' -c user.email='ci@localhost' \
              merge --no-edit "${target_sha}"
          echo "Integrated master ${target_sha}"

      - name: 配置内网 pip 源并安装测试依赖
        shell: bash
        run: |
          set -euo pipefail
          PYPI_URL="${{ vars.PYPI_URL || 'http://10.16.1.201:9929' }}"
          TRUSTED_HOST="${PYPI_URL#*://}"; TRUSTED_HOST="${TRUSTED_HOST%%/*}"
          mkdir -p ~/.pip && printf '%s\n' \
            '[global]' \
            "index-url = ${PYPI_URL}/${{ matrix.pip_index_suffix }}" \
            "trusted-host = ${TRUSTED_HOST}" \
            > ~/.pip/pip.conf
          pip install --no-cache-dir torch==${TORCH_VERSION} ninja wheel setuptools
          if [ "${{ matrix.need_vllm }}" = "true" ]; then
            pip install --no-cache-dir triton==3.6.0
            pip install --no-cache-dir --pre "vllm==0.28.1" "vllm-hcu>0.28.0,<=0.28.1"
          fi

      - name: 安装 AICC
        shell: bash
        run: |
          wget ${{ vars.RESOURCE_SERVER_URL || 'http://10.16.1.201:8000' }}/ai_cc/Nightly/hcu_llvm_installer.sh
          bash hcu_llvm_installer.sh --major ${{ matrix.aicc_major }}
        env:
          RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL || 'http://10.16.1.201:8000' }}

      - name: 编译并安装 lightop
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source /opt/dtk/env.sh
          pip install --no-cache-dir ninja wheel setuptools
          python3 setup.py bdist_wheel
          pip install --no-deps --force-reinstall dist/*.whl
          python3 -c "import lightop; print(f'lightop={lightop.__version__}')"

      - name: 安装 pytest
        run: python3 -m pip install --no-cache-dir pytest

      - name: 运行 test/ci_tests
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          # shellcheck disable=SC1091
          source /opt/dtk/env.sh
          cd test/ci_tests
          python3 -m pytest -v -p no:cacheprovider --tb=short \
              --junitxml="${GITHUB_WORKSPACE}/junit-dtk${DTK_TAG}-${TORCH_VERSION}.xml"

      - name: 清理 workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
