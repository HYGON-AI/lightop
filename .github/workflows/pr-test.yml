name: pr-test

# 仅 PR 创建/更新时触发一次完整编译+测试
# pull_request_target: 使 fork PR 也能读取主仓 vars; 工作流文件取自 master 分支,
# 编译测试的仍是 PR 代码。安全注意: 会在主仓上下文执行 fork 代码, 禁止在本工作流
# 引用任何 secrets
on:
  pull_request_target:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  # 发布 JUnit 报告到 PR 检查需要
  checks: write

concurrency:
  group: pr-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # csrc 内核多且重, 显式控制 ninja 并行度以缩短编译时间
  MAX_JOBS: "32"

jobs:
  test:
    # 需要 docker 与内网 pip 源访问能力的自托管 runner
    runs-on: self-hosted
    timeout-minutes: 480
    strategy:
      # 一个 torch 版本的失败不应掩盖另一个版本的结果
      fail-fast: false
      matrix:
        torch_version: ${{ fromJSON(vars.LIGHTOP_TORCH_VERSIONS || '["2.10.0", "2.11.0"]') }}
        include:
          - torch_version: 2.10.0
            test_image: 10.16.1.152:5000/jenkins/model_test_env/vllm:0.21.0-latest
          - torch_version: 2.11.0
            test_image: 10.16.1.152:5000/jenkins/model_test_env/vllm:0.25.1-latest
    env:
      TORCH_VERSION: ${{ matrix.torch_version }}
    container:
      # include 未覆盖的新 torch 版本走默认测试镜像
      image: ${{ matrix.test_image || vars.LIGHTOP_CI_TEST_IMAGE || '10.16.1.152:5000/jenkins/model_test_env/vllm:0.25.1-latest' }}
      options: >-
        --volume /opt/hyhal:/opt/hyhal:ro
        --device /dev/kfd:/dev/kfd
        --device /dev/dri:/dev/dri
        --cap-add=SYS_PTRACE
        --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Integrate latest master
        # 测试的应该是合入 master 之后的结果: 先把最新 master 合并进当前分支再打包
        shell: bash
        run: |
          set -euo pipefail
          # 镜像默认用户与 checkout 目录属主不一致时 git 拒绝操作, 显式豁免
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          target_sha="$(git rev-parse origin/master)"
          git -c user.name='LightOp CI' -c user.email='ci@localhost' \
              merge --no-edit "${target_sha}"
          echo "Integrated master ${target_sha}"

      - name: Install AICC
        shell: bash
        run: |
          wget ${{ vars.RESOURCE_SERVER_URL }}/ai_cc/Nightly/hcu_llvm_installer.sh
          bash hcu_llvm_installer.sh --major 1.0.0
        env:
          RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}

      - name: 编译并安装 lightop
        # vllm 测试镜像自带 DTK 编译环境, 直接源码编译, 无需跨 job 传递 wheel
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /opt/dtk/env.sh ]; then
            # shellcheck disable=SC1091
            source /opt/dtk/env.sh
          fi
          pip install --no-cache-dir ninja wheel setuptools
          python3 setup.py bdist_wheel
          pip install --no-deps --force-reinstall dist/*.whl
          python3 -c "import lightop; print(f'lightop={lightop.__version__}')"

      - name: install pytest
        run: python3 -m pip install --no-cache-dir pytest

      - name: 运行 test/ci_tests
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          # 加载 DTK 运行环境 (LD_LIBRARY_PATH 等)
          if [ -f /opt/dtk/env.sh ]; then
            # shellcheck disable=SC1091
            source /opt/dtk/env.sh
          fi
          cd test/ci_tests
          # junit 写到 workspace, 发布动作另起容器运行, 只挂载 workspace 读得到
          python3 -m pytest -v -p no:cacheprovider --tb=short \
              --junitxml="${GITHUB_WORKSPACE}/junit-${TORCH_VERSION}.xml"

      - name: 发布 JUnit 报告到 PR
        if: always()
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          # 相对路径, 从 workspace 根解析
          files: junit-${{ matrix.torch_version }}.xml

      # 容器内以 root 运行, workspace 里的文件会归 root 所有,
      # 宿主机上后续 job 的 checkout 无法清理, 退出前清空
      - name: 清理 workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
