name: pr-test

# 仅 PR 创建/更新时触发一次完整编译+测试
# pull_request (非 pull_request_target): 工作流在受限上下文运行, token 只读、
# 无 secrets, checkout fork 代码不受 actions/checkout 的 pwn request 拦截
on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: pr-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # csrc 内核多且重, 显式控制 ninja 并行度以缩短编译时间
  MAX_JOBS: "32"

jobs:
  test:
    # 需要 docker 与内网 pip 源访问能力的自托管 runner
    runs-on: self-hosted
    timeout-minutes: 480
    strategy:
      # 一个 dtk/torch 组合的失败不应掩盖另一个组合的结果
      fail-fast: false
      matrix:
        include:
          # ---- dtk26.04 现网基线: torch 2.11 ----
          - dtk_tag: 2604
            aicc_major: "1.0.0"
            torch_version: "2.11.0"
            test_image: 10.16.1.152:5000/jenkins/model_test_env/vllm:0.25.1-latest
          # ---- dtk26.10 新增: 镜像自带 DTK26.10 + torch 2.11 (py3.12) ----
          - dtk_tag: 2610
            aicc_major: "2.0.0"
            torch_version: "2.11.0"
            test_image: 10.16.1.152:5000/jenkins/model_test_env/vllm:0.28.1rc1-ubuntu22.04-dtk2610-py3.12-20261015-1511
    env:
      TORCH_VERSION: ${{ matrix.torch_version }}
      DTK_TAG: ${{ matrix.dtk_tag }}
    container:
      # include 未覆盖的新 torch 版本走默认测试镜像
      image: ${{ matrix.test_image || vars.LIGHTOP_CI_TEST_IMAGE || '10.16.1.152:5000/jenkins/model_test_env/vllm:0.25.1-latest' }}
      options: >-
        --volume /opt/hyhal:/opt/hyhal:ro
        --device /dev/kfd:/dev/kfd
        --device /dev/dri:/dev/dri
        --cap-add=SYS_PTRACE
        --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Integrate latest master
        if: matrix.dtk_tag != '2610'
        # 测试的应该是合入 master 之后的结果: 先把最新 master 合并进当前分支再打包
        shell: bash
        run: |
          set -euo pipefail
          # 镜像默认用户与 checkout 目录属主不一致时 git 拒绝操作, 显式豁免
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          target_sha="$(git rev-parse origin/master)"
          git -c user.name='LightOp CI' -c user.email='ci@localhost' \
              merge --no-edit "${target_sha}"
          echo "Integrated master ${target_sha}"

      # ---- dtk2610: 与编译镜像区分, 单测镜像只补齐 vllm/vllm-hcu/triton/torch,
      # AICC 由下方 Install AICC 步骤统一安装 (镜像构建同为 --major 2.0.0) ----
      - name: 配置内网 pip 源并安装测试依赖 (dtk2610)
        if: matrix.dtk_tag == '2610'
        shell: bash
        run: |
          set -euo pipefail
          PYPI_URL="${{ vars.PYPI_URL || 'http://10.16.1.201:9929' }}"
          TRUSTED_HOST="${PYPI_URL#*://}"; TRUSTED_HOST="${TRUSTED_HOST%%/*}"
          mkdir -p ~/.pip && printf '%s\n' \
            '[global]' \
            "index-url = ${PYPI_URL}/nightly/dtk2610/+simple/" \
            "trusted-host = ${TRUSTED_HOST}" \
            > ~/.pip/pip.conf
          pip install --no-cache-dir "vllm==0.28.1" "vllm-hcu>0.28.0,<=0.28.1"
          pip install --no-cache-dir triton==3.6.0 torch==2.11.0

      - name: Install AICC
        # dtk2610 对应 AICC 2.0.0, dtk2604 基线为 1.0.0 (aicc_major 随矩阵下发)
        # fork PR 的 pull_request 事件读不到主仓 vars, 回退到主仓配置的同一内网值
        shell: bash
        run: |
          wget ${{ vars.RESOURCE_SERVER_URL || 'http://10.16.1.201:8000' }}/ai_cc/Nightly/hcu_llvm_installer.sh
          bash hcu_llvm_installer.sh --major ${{ matrix.aicc_major }}
        env:
          RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL || 'http://10.16.1.201:8000' }}

      - name: 编译并安装 lightop
        # vllm 测试镜像自带 DTK 编译环境, 直接源码编译, 无需跨 job 传递 wheel
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /opt/dtk/env.sh ]; then
            # shellcheck disable=SC1091
            source /opt/dtk/env.sh
          fi
          pip install --no-cache-dir ninja wheel setuptools
          python3 setup.py bdist_wheel
          pip install --no-deps --force-reinstall dist/*.whl
          python3 -c "import lightop; print(f'lightop={lightop.__version__}')"

      - name: install pytest
        run: python3 -m pip install --no-cache-dir pytest

      - name: 运行 test/ci_tests
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          # 加载 DTK 运行环境 (LD_LIBRARY_PATH 等)
          if [ -f /opt/dtk/env.sh ]; then
            # shellcheck disable=SC1091
            source /opt/dtk/env.sh
          fi
          cd test/ci_tests
          # junit 命名带 dtk/torch 组合, 避免不同矩阵项互相覆盖
          python3 -m pytest -v -p no:cacheprovider --tb=short \
              --junitxml="${GITHUB_WORKSPACE}/junit-dtk${DTK_TAG}-${TORCH_VERSION}.xml"

      # 容器内以 root 运行, workspace 里的文件会归 root 所有,
      # 宿主机上后续 job 的 checkout 无法清理, 退出前清空
      - name: 清理 workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
