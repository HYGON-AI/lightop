name: pr-test

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: pr-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MAX_JOBS: "32"
  PYPI_URL: ${{ vars.PYPI_URL || 'http://10.16.1.201:9929' }}
  RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL || 'http://10.16.1.201:8000' }}

jobs:
  build-and-test:
    name: build-and-test (dtk${{ matrix.dtk_version }})
    # 编译与测试在同一个容器内直接进行, 不再单独起 test 容器
    runs-on: [self-hosted, BW1100]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk_version: "26.10"
            pip_index_suffix: nightly/dtk2610/+simple/
            torch_version: "2.11.0"
            py_version: "3.12"
          - dtk_version: "26.10"
            pip_index_suffix: nightly/dtk2610/+simple/
            torch_version: "2.13.0"
            py_version: "3.12"
    env:
      TORCH_VERSION: ${{ matrix.torch_version }}
      DTK_VERSION: ${{ matrix.dtk_version }}
    container:
      # DTK 基础镜像, 自带 /opt/dtk
      image: 10.16.1.152:5000/hcu/base/dtk:${{ matrix.dtk_version }}-ubuntu22.04-py${{ matrix.py_version }}
      options: >-
        -v /opt/hyhal/:/opt/hyhal/:ro
        --device /dev/kfd:/dev/kfd
        --device /dev/dri:/dev/dri
        --shm-size=80G
        --cap-add=SYS_PTRACE
        --security-opt seccomp=unconfined
        --privileged=true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 合入最新 master
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          target_sha="$(git rev-parse origin/master)"
          git -c user.name='LightOp CI' -c user.email='ci@localhost' \
              merge --no-edit "${target_sha}"
          echo "Integrated master ${target_sha}"

      - name: 安装 AICC
        shell: bash
        run: |
          wget ${{ env.RESOURCE_SERVER_URL }}/ai_cc/Nightly/hcu_llvm_installer.sh
          bash hcu_llvm_installer.sh

      - name: 安装 torch (编译前置依赖)
        # 显式 --index-url: 镜像内置 pip 配置会覆盖 user 级 pip.conf
        shell: bash
        run: |
          PIP_INDEX="${{ env.PYPI_URL }}/${{ matrix.pip_index_suffix }}"
          PIP_FLAGS=(--no-cache-dir --index-url "$PIP_INDEX" --trusted-host "${PIP_INDEX#*://}")
          pip install "${PIP_FLAGS[@]}" torch==${TORCH_VERSION}

      - name: 编译 manylinux wheel
        shell: bash
        run: bash scripts/build_hcu_wheel.sh --output-dir dist-manylinux

      - name: 安装测试依赖与 lightop
        # 安装编译脚本产出的 manylinux wheel, 保证测试对象与发布产物一致
        shell: bash
        run: |
          set -euo pipefail
          PIP_INDEX="${{ env.PYPI_URL }}/${{ matrix.pip_index_suffix }}"
          PIP_FLAGS=(--no-cache-dir --index-url "$PIP_INDEX" --trusted-host "${PIP_INDEX#*://}")
          pip install "${PIP_FLAGS[@]}" --force-reinstall --no-deps dist-manylinux/*.whl
          pip install "${PIP_FLAGS[@]}" pytest numpy==2.1.0 vllm==0.28.1 amdsmi==1.0.0+630c16a6.dirty flash-attn

      - name: Checkout 测试用例
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # The CI suite imports reference helpers from test/test_adaptive_topk.py.
          sparse-checkout: test

      - name: 运行 test/ci_tests
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          # shellcheck disable=SC1091
          source /opt/dtk/env.sh
          cd test/ci_tests
          export PYTHONPATH="${GITHUB_WORKSPACE}/test${PYTHONPATH:+:${PYTHONPATH}}"
          python3 -m pytest -v -p no:cacheprovider --tb=short \
              --junitxml="${GITHUB_WORKSPACE}/junit-dtk${DTK_VERSION}-${TORCH_VERSION}.xml"

      - name: 清理 workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
