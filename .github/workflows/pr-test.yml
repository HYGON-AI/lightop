name: pr-test

# 仅 PR 创建/更新时触发一次完整编译+测试
# pull_request (非 pull_request_target): checkout 的代码在受限上下文运行,
# token 只读、无 secrets, checkout fork 代码无需 allow-unsafe-pr-checkout 放行。
# 注意: fork PR 的 pull_request 事件读不到主仓 vars (实测为空), 关键配置
# 必须带内网默认值兜底 (与 matrix 里硬编码测试镜像同一路数)。
on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: pr-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # csrc 内核多且重, 显式控制 ninja 并行度以缩短编译时间
  MAX_JOBS: "32"

jobs:
  test:
    # 需要 docker 与内网 pip 源访问能力的自托管 runner
    runs-on: self-hosted
    timeout-minutes: 480
    strategy:
      # 一个 torch 版本的失败不应掩盖另一个版本的结果
      fail-fast: false
      matrix:
        torch_version: ${{ fromJSON(vars.LIGHTOP_TORCH_VERSIONS || '["2.10.0", "2.11.0"]') }}
        include:
          - torch_version: 2.10.0
            test_image: 10.16.1.152:5000/jenkins/model_test_env/vllm:0.21.0-latest
          - torch_version: 2.11.0
            test_image: 10.16.1.152:5000/jenkins/model_test_env/vllm:0.25.1-latest
    env:
      TORCH_VERSION: ${{ matrix.torch_version }}
    container:
      # include 未覆盖的新 torch 版本走默认测试镜像
      image: ${{ matrix.test_image || vars.LIGHTOP_CI_TEST_IMAGE || '10.16.1.152:5000/jenkins/model_test_env/vllm:0.25.1-latest' }}
      options: >-
        --volume /opt/hyhal:/opt/hyhal:ro
        --device /dev/kfd:/dev/kfd
        --device /dev/dri:/dev/dri
        --cap-add=SYS_PTRACE
        --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # pull_request 事件默认 checkout refs/pull/<n>/merge (PR 与 master
          # 的合并预演), 不需要显式指定 head sha
          fetch-depth: 0
          persist-credentials: false

      - name: Integrate latest master
        # 测试的应该是合入 master 之后的结果: merge ref 本身就是 PR 与最新
        # master 的合并结果, 这里仅记录基准 sha 便于追溯
        shell: bash
        run: |
          set -euo pipefail
          # 镜像默认用户与 checkout 目录属主不一致时 git 拒绝操作, 显式豁免
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          target_sha="$(git rev-parse origin/master)"
          echo "Testing merge commit ${GITHUB_SHA} (PR merged with master ${target_sha})"

      - name: Install AICC
        shell: bash
        # fork PR 上 vars.RESOURCE_SERVER_URL 为空, 回退到主仓配置的值
        run: |
          wget "${RESOURCE_SERVER_URL}/ai_cc/Nightly/hcu_llvm_installer.sh"
          bash hcu_llvm_installer.sh --major 1.0.0
        env:
          RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL || 'http://10.16.1.201:8000' }}

      - name: 编译并安装 lightop
        # vllm 测试镜像自带 DTK 编译环境, 直接源码编译, 无需跨 job 传递 wheel
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /opt/dtk/env.sh ]; then
            # shellcheck disable=SC1091
            source /opt/dtk/env.sh
          fi
          pip install --no-cache-dir ninja wheel setuptools
          python3 setup.py bdist_wheel
          pip install --no-deps --force-reinstall dist/*.whl
          python3 -c "import lightop; print(f'lightop={lightop.__version__}')"

      - name: install pytest
        run: python3 -m pip install --no-cache-dir pytest

      - name: 运行 test/ci_tests
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          # 加载 DTK 运行环境 (LD_LIBRARY_PATH 等)
          if [ -f /opt/dtk/env.sh ]; then
            # shellcheck disable=SC1091
            source /opt/dtk/env.sh
          fi
          cd test/ci_tests
          python3 -m pytest -v -p no:cacheprovider --tb=short \
              --junitxml="${GITHUB_WORKSPACE}/junit-${TORCH_VERSION}.xml"

      - name: 清理 workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
