name: release-pypi

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

env:
  PYPI_URL: ${{ vars.PYPI_URL }}
  MAX_JOBS: "32"

jobs:
  compile:
    concurrency:
      group: release-nightly-hcu-${{ github.ref }}-dtk${{ matrix.dtk_tag }}-py${{ matrix.torch_version }}
      cancel-in-progress: true
    runs-on: [self-hosted]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk_tag: 2604
            pip_index_suffix: nightly/dtk2604/+simple/
            aicc_major: "1.0.0"
            torch_version: "2.10.0"
          - dtk_tag: 2604
            pip_index_suffix: nightly/dtk2604/+simple/
            aicc_major: "1.0.0"
            torch_version: "2.11.0"
          - dtk_tag: 2610
            pip_index_suffix: nightly/dtk2610/+simple/
            aicc_major: "2.0.0"
            torch_version: "2.11.0"
    env:
      TORCH_VERSION: ${{ matrix.torch_version }}
      DTK_TAG: ${{ matrix.dtk_tag }}
    container:
      # DTK 基础镜像, 自带 /opt/dtk
      image: 10.16.1.152:5000/hcu/base/dtk:${{ matrix.dtk_tag == '2610' && '26.10' || '26.04' }}-rockylinux8.6-py3.10
      options: >-
        --device=/dev/kfd --device=/dev/dri/ --group-add video
        -v /opt/hyhal/:/opt/hyhal/:ro
        --shm-size=80G
        --cap-add=SYS_PTRACE
        --security-opt seccomp=unconfined
        --privileged=true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 打印环境变量
        run: |
          echo "TORCH_VERSION=${TORCH_VERSION}"
          echo "DTK_TAG=${DTK_TAG}"
          echo "PYPI_URL=${PYPI_URL}"

      - name: 配置内网 pip 源
        shell: bash
        run: |
          TRUSTED_HOST="${PIP_INDEX#*://}"; TRUSTED_HOST="${TRUSTED_HOST%%/*}"
          mkdir -p ~/.pip && printf '%s\n' \
            '[global]' \
            "index-url = ${PIP_INDEX}" \
            "trusted-host = ${TRUSTED_HOST}" \
            > ~/.pip/pip.conf
        env:
          PIP_INDEX: ${{ env.PYPI_URL }}/${{ matrix.pip_index_suffix }}

      - name: 安装 AICC
        shell: bash
        run: |
          wget ${{ vars.RESOURCE_SERVER_URL }}/ai_cc/Nightly/hcu_llvm_installer.sh
          bash hcu_llvm_installer.sh --major ${{ matrix.aicc_major }}
        env:
          RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}

      - name: 安装编译依赖
        shell: bash
        run: |
          pip install --no-cache-dir numpy==1.26.4 torch==${TORCH_VERSION} ninja wheel setuptools

      - name: 编译 wheel
        shell: bash
        run: |
          source /opt/dtk/env.sh
          python3 setup.py bdist_wheel

      - name: 生成 manylinux wheel
        run: |
          pip install --no-cache-dir --no-deps dist/*.whl
          bash .github/scripts/manylinux_repair.sh dist dist-manylinux

      - name: CIUpload REPAIR
        run: |
          pip install --no-cache-dir ciupload
          DTK_VER=$(cat /opt/dtk/.info/rocm_version | tr -d '.')
          WHEEL_COMMIT_SHA="$(git rev-parse HEAD)"
          CIUpload REPAIR \
            --dtk_version "${DTK_VER}" \
            --torch_version "${TORCH_VERSION}" \
            --git_commit "${WHEEL_COMMIT_SHA}" \
            --outputdir output \
            -f dist-manylinux/*.whl

      - name: CIUpload NIGHTLY
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          DTK_VER=$(cat /opt/dtk/.info/rocm_version | tr -d '.')
          CIUpload NIGHTLY --devpi_url ${PYPI_URL} --password ${{ secrets.PYPI_PASSWORD }} \
            --dtk_pkg_name "DTK-${DTK_VER}-Rocky8.6-x86_64.tar.gz" \
            -f output/*.whl --record

      - name: 清理 workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
