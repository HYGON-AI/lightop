name: release-pypi

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

env:
  PYPI_URL: ${{ vars.PYPI_URL }}
  MAX_JOBS: "32"

jobs:
  compile:
    concurrency:
      group: release-nightly-hcu-${{ github.ref }}-dtk${{ matrix.dtk_version }}-${{ matrix.torch_version }}-py${{ matrix.py_version }}
      cancel-in-progress: true
    runs-on: [self-hosted]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk_version: "26.04"
            pip_index_suffix: nightly/dtk2604/+simple/
            aicc_major: "1.0.0"
            torch_version: "2.11.0"
            py_version: "3.10"
          - dtk_version: "26.04"
            pip_index_suffix: nightly/dtk2604/+simple/
            aicc_major: "1.0.0"
            torch_version: "2.11.0"
            py_version: "3.12"
          - dtk_version: "26.10"
            pip_index_suffix: nightly/dtk2610/+simple/
            aicc_major: "2.0.0"
            torch_version: "2.11.0"
            py_version: "3.12"
    env:
      TORCH_VERSION: ${{ matrix.torch_version }}
      DTK_VERSION: ${{ matrix.dtk_version }}
    container:
      # DTK 基础镜像, 自带 /opt/dtk
      image: 10.16.1.152:5000/hcu/base/dtk:${{ matrix.dtk_version }}-rockylinux8.6-py${{ matrix.py_version }}
      options: >-
        --device=/dev/kfd --device=/dev/dri/ --group-add video
        -v /opt/hyhal/:/opt/hyhal/:ro
        --shm-size=80G
        --cap-add=SYS_PTRACE
        --security-opt seccomp=unconfined
        --privileged=true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 AICC
        shell: bash
        run: |
          wget ${{ vars.RESOURCE_SERVER_URL }}/ai_cc/Nightly/hcu_llvm_installer.sh
          bash hcu_llvm_installer.sh --major ${{ matrix.aicc_major }}
        env:
          RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}

      - name: 安装编译依赖
        shell: bash
        run: |
          PIP_INDEX="${{ env.PYPI_URL }}/${{ matrix.pip_index_suffix }}"
          PIP_FLAGS=(--no-cache-dir --index-url "$PIP_INDEX" --trusted-host "${PIP_INDEX#*://}")
          pip install "${PIP_FLAGS[@]}" torch==${TORCH_VERSION} ninja wheel setuptools build

      - name: 编译 wheel
        shell: bash
        run: |
          source /opt/dtk/env.sh
          python3 setup.py bdist_wheel

      - name: 生成 manylinux wheel
        run: |
          pip install --no-cache-dir --no-deps dist/*.whl
          bash .github/scripts/manylinux_repair.sh dist dist-manylinux

      - name: CIUpload REPAIR
        run: |
          pip install --no-cache-dir ciupload
          DTK_VER=$(cat /opt/dtk/.info/rocm_version | tr -d '.')
          WHEEL_COMMIT_SHA="$(git rev-parse HEAD)"
          CIUpload REPAIR \
            --dtk_version "${DTK_VER}" \
            --torch_version "${TORCH_VERSION}" \
            --git_commit "${WHEEL_COMMIT_SHA}" \
            --outputdir output \
            -f dist-manylinux/*.whl

      - name: CIUpload NIGHTLY
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          DTK_VER=$(cat /opt/dtk/.info/rocm_version | tr -d '.')
          CIUpload NIGHTLY --devpi_url ${PYPI_URL} --password ${{ secrets.PYPI_PASSWORD }} \
            --dtk_version  ${DTK_VER} \
            -f output/*.whl --record

      - name: 清理 workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
