name: release-pypi

on:
  # ---- 合入 master 分支后触发 ----
  push:
    branches:
      - master

  # ---- 手动触发，仅构建产物，不上传 NIGHTLY ----
  workflow_dispatch:

permissions:
  contents: read

env:
  DTK_PKG_URL: ${{ vars.RESOURCE_SERVER_URL }}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
  PYPI_URL: ${{ vars.PYPI_URL }}
  # csrc 内核多且重, 显式控制 ninja 并行度以缩短编译时间
  MAX_JOBS: "32"

jobs:
  compile:
    # ---- 并发控制: 同一分支 + 同一 torch 版本的 job 只保留最新一个 ----
    concurrency:
      group: release-nightly-hcu-${{ github.ref }}-py${{ matrix.torch_version }}
      cancel-in-progress: true
    # ---- 自托管 HCU runner，在 Docker 容器内执行 ----
    runs-on: [self-hosted, hcu]
    timeout-minutes: 180
    strategy:
      # 一个 torch 版本的失败不应掩盖另一个版本的结果
      fail-fast: false
      matrix:
        # 固定两个版本并行, 不依赖仓库变量
        torch_version: ["2.10.0", "2.11.0"]
    env:
      TORCH_VERSION: ${{ matrix.torch_version }}
    container:
      image: ${{ vars.BASE_COMPILE_IMAGE_ROCKY_PY310 }}
      options: >-
        --device=/dev/kfd --device=/dev/dri/ --group-add video
        -v /opt/hyhal/:/opt/hyhal/:ro
        --shm-size=80G
        --cap-add=SYS_PTRACE
        --security-opt seccomp=unconfined
        --privileged=true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 打印环境变量
        run: |
          echo "TORCH_VERSION=${TORCH_VERSION}"
          echo "DTK_PKG_URL=${DTK_PKG_URL}"
          echo "PYPI_URL=${PYPI_URL}"

      - name: 准备构建工具
        shell: bash
        run: |
          # 镜像自带 wget, 只需配置内网 pip 源
          TRUSTED_HOST="${PIP_INDEX#*://}"; TRUSTED_HOST="${TRUSTED_HOST%%/*}"
          mkdir -p ~/.pip && printf '%s\n' \
            '[global]' \
            "index-url = ${PIP_INDEX}" \
            "trusted-host = ${TRUSTED_HOST}" \
            > ~/.pip/pip.conf
        env:
          PIP_INDEX: ${{ env.PYPI_URL }}/nightly/dtk2604/+simple/

      - name: Install DTK
        shell: bash
        run: |
          cd /opt
          wget -q "$DTK_PKG_URL"
          tar -xzf "$(basename "$DTK_PKG_URL")"
          mv dtk-* dtk
        env:
          DTK_PKG_URL: ${{ env.DTK_PKG_URL }}

      - name: 获取最新 AICC
        shell: bash
        run: |
          AICC_URL="${RESOURCE_SERVER_URL}/ai_cc/nightly/"
          HTTP_CODE=$(curl -s --connect-timeout 10 -o /tmp/aicc_index.html -w "%{http_code}" "${AICC_URL}" || true)
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "无法访问 AICC nightly 索引 (HTTP ${HTTP_CODE}): ${AICC_URL}"
            exit 1
          fi
          LATEST_AICC=$(grep -oP 'dtk_llvm_[^"]+\.run' /tmp/aicc_index.html | sed 's/\.run$//' | sort -t '_' -k4 -nr | head -n1)
          if [ -z "${LATEST_AICC}" ]; then
            echo "AICC 索引页解析失败, 页面内容开头:"
            head -c 500 /tmp/aicc_index.html
            exit 1
          fi
          echo "AICC_URL=${AICC_URL}${LATEST_AICC}.run" >> "$GITHUB_ENV"
          echo "AICC_VERSION=${LATEST_AICC#dtk_llvm_}" >> "$GITHUB_ENV"
        env:
          RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}

      - name: Install AICC
        shell: bash
        run: |
          wget -q "${AICC_URL}" -O /tmp/dtk_llvm.run
          # yes 管道在安装器退出后触发 SIGPIPE, pipefail 下会让步骤误报失败,
          # 改用进程替换, 使安装器自身退出码决定步骤结果
          bash /tmp/dtk_llvm.run < <(yes)

      - name: install deps
        shell: bash
        run: |
          pip install --no-cache-dir numpy==1.26.4 torch==${TORCH_VERSION} ninja wheel setuptools

      - name: build wheel
        shell: bash
        run: |
          source /opt/dtk/env.sh
          python3 setup.py bdist_wheel

      - name: 生成 manylinux wheel
        run: |
          # repair 脚本不依赖 import lightop, 自行用 pip Location 定位自带库路径
          pip install --no-cache-dir --no-deps dist/*.whl
          bash .github/scripts/manylinux_repair.sh dist dist-manylinux

      - name: Apply DAS local version to wheels
        run: |
          pip install --no-cache-dir ciupload
          DTK_VER=$(echo $DTK_PKG_URL | grep -oP 'dtk\K[0-9]+\.[0-9]+' | tr -d '.')
          WHEEL_COMMIT_SHA="$(git rev-parse HEAD)"
          CIUpload REPAIR \
            --dtk_version "${DTK_VER}" \
            --torch_version "${TORCH_VERSION}" \
            --git_commit "${WHEEL_COMMIT_SHA}" \
            --outputdir output \
            -f dist-manylinux/*.whl

      - name: 上传 NIGHTLY
        if: ${{ github.event_name == 'push' }}
        run: |
          CIUpload --devpi_url ${PYPI_URL} --devpi_user ${{ secrets.PYPI_USERNAME }} --devpi_password ${{ secrets.PYPI_PASSWORD }} --dtk_pkg_name $(basename $DTK_PKG_URL) -f output/*.whl

      # 容器内以 root 运行, workspace 里的文件会归 root 所有,
      # 宿主机上后续 job 的 checkout 无法清理, 退出前清空
      - name: 清理 workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* || true
