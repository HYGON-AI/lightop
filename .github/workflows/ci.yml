name: LightOp CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      test_torch_versions:
        description: JSON array of Torch lanes to build and test
        required: true
        default: '["2.10.0", "2.11.0"]'
        type: string
      publish_packages:
        description: Publish validated wheels from this manual run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lightop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Preparation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.integrate_source.outputs.target_sha }}

    steps:
      - name: Checkout LightOp
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Integrate latest target branch
        id: integrate_source
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.base_ref || 'master' }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse "origin/${TARGET_BRANCH}")"
          source_sha="$(git rev-parse HEAD)"
          git -c user.name='LightOp CI' -c user.email='ci@localhost' \
              merge --no-edit "${target_sha}"
          integrated_sha="$(git rev-parse HEAD)"
          echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Integrated LightOp source"
            echo
            echo "- Target branch: \`${TARGET_BRANCH}\`"
            echo "- Target commit: \`${target_sha}\`"
            echo "- Source commit: \`${source_sha}\`"
            echo "- Integrated commit: \`${integrated_sha}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check Python syntax
        run: python -m compileall -q python tools

      - name: Enforce public CI naming policy
        shell: bash
        run: |
          set -euo pipefail
          forbidden_pattern='[dD][cC][uU]'
          if git grep -IiqE "${forbidden_pattern}" -- .; then
            echo "::error::Tracked sources violate the public naming policy."
            exit 1
          fi

  test:
    name: Build and Test (Torch ${{ matrix.torch_version }})
    needs: prepare

    # Never execute code from an untrusted fork on an internal runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: [self-hosted, Linux, X64, hcu-ci-pr, nmz36]
    timeout-minutes: 240

    strategy:
      # A failure in one compatibility lane must not hide the result of the
      # other supported Torch version. Override the JSON array with the
      # LIGHTOP_TORCH_VERSIONS repository variable when needed.
      fail-fast: false
      matrix:
        torch_version: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.test_torch_versions || vars.LIGHTOP_TORCH_VERSIONS || '["2.10.0", "2.11.0"]') }}

    env:
      CI_BASE_IMAGE: ${{ vars.LIGHTOP_CI_BASE_IMAGE_REPOSITORY || '42.228.13.241:5000/dev/dev:rockylinux8.6-mpi5.0-gcc13.3-cmake3.29-py3.10-mkl2024.2.0.664' }}
      DTK_PKG_PATH: ${{ vars.LIGHTOP_DTK_PKG_PATH || 'http://10.16.1.201:8000/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz' }}
      AICC_NIGHTLY_DIR: /public/opendas/ArchivedFile/ai_cc/nightly
      CI_NODE_OUTPUT_ROOT: ${{ vars.LIGHTOP_CI_OUTPUT_ROOT || '/public/home/guochy1/guochy1/framework/workspace/logs' }}
      PYTHON_VERSION: "3.10"
      CI_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      INSTALL_TORCH_VERSION: ${{ matrix.torch_version }}
      CI_COMPILE_IMAGE: lightop-ci:${{ github.run_id }}-${{ github.run_attempt }}-torch${{ matrix.torch_version }}
      CI_COMPILE_CONTAINER_NAME: lightop-build-${{ github.run_id }}-${{ github.run_attempt }}-torch${{ matrix.torch_version }}
      CI_TEST_CONTAINER_NAME: lightop-test-${{ github.run_id }}-${{ github.run_attempt }}-torch${{ matrix.torch_version }}
      # These images contain the pre-built vLLM/HCU runtime for their Torch lane.
      # Keep the mapping explicit: the two vLLM ABIs are not interchangeable.
      CI_TEST_IMAGE: ${{ matrix.torch_version == '2.10.0' && 'pypi.sourcefind.cn/jenkins/model_test_env/vllm:latest' || 'pypi.sourcefind.cn/jenkins/model_test_env/vllm:0.25.1-latest' }}
      EXPECTED_VLLM_VERSION: ${{ matrix.torch_version == '2.10.0' && '0.21.0' || '0.25.1' }}
      # The two Torch matrix lanes run concurrently on separate fixed cards.
      # The image only supports the two versions mapped below.
      STATIC_ROCR_VISIBLE_DEVICES: ${{ matrix.torch_version == '2.10.0' && '0' || '1' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Repair workspace ownership before checkout
        shell: bash
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"

          docker pull "${CI_BASE_IMAGE}" 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'
          docker run --rm \
            --user 0:0 \
            --entrypoint /bin/bash \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${CI_BASE_IMAGE}" \
            -lc '
              chown -R "$1:$2" /workspace
              chmod -R u+rwX /workspace
            ' _ "${runner_uid}" "${runner_gid}"

          preferred_output_root="${CI_NODE_OUTPUT_ROOT}"
          fallback_output_root="$(dirname "${GITHUB_WORKSPACE}")/.lightop-ci-outputs"
          if mkdir -p "${preferred_output_root}/lightop" 2>/dev/null && \
             test -w "${preferred_output_root}/lightop"; then
            resolved_output_root="${preferred_output_root}"
          else
            resolved_output_root="${fallback_output_root}"
            mkdir -p "${resolved_output_root}/lightop"
            test -w "${resolved_output_root}/lightop"
            echo "::warning::Preferred output root is not writable: ${preferred_output_root}. Using ${resolved_output_root}."
          fi
          echo "CI_NODE_OUTPUT_ROOT=${resolved_output_root}" >> "${GITHUB_ENV}"
          echo "Node output directory is writable: ${resolved_output_root}/lightop"

      - name: Checkout LightOp
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Integrate latest target branch
        shell: bash
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          set -euo pipefail
          git -c user.name='LightOp CI' -c user.email='ci@localhost' \
              merge --no-edit "${TARGET_SHA}"

      - name: Prepare runner and build context
        shell: bash
        run: |
          set -euo pipefail
          CI_BUILD_CONTEXT="${RUNNER_TEMP}/lightop-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-torch${INSTALL_TORCH_VERSION}"
          echo "CI_BUILD_CONTEXT=${CI_BUILD_CONTEXT}" >> "${GITHUB_ENV}"

          docker version
          test -e /dev/mkfd
          test -e /dev/kfd
          test -d /dev/dri
          test -x /opt/hyhal/bin/hy-smi
          test -d "${AICC_NIGHTLY_DIR}"
          ls -l /dev/mkfd /dev/kfd /dev/dri/*

          bash .github/ci/prepare-build-context.sh \
            "${CI_BUILD_CONTEXT}" \
            "${GITHUB_WORKSPACE}" \
            "${DTK_PKG_PATH}" \
            "${AICC_NIGHTLY_DIR}" \
            "${CI_SOURCE_BRANCH}"

          test ! -e "${CI_BUILD_CONTEXT}/lightop/.git"

      - name: "Build: Create LightOp image"
        shell: bash
        run: |
          set -euo pipefail
          source "${CI_BUILD_CONTEXT}/build-environment.txt"

          docker build \
            --pull \
            --no-cache \
            --network host \
            --build-arg "BASE_IMAGE=${CI_BASE_IMAGE}" \
            --build-arg "PYTHON_VERSION=${PYTHON_VERSION}" \
            --build-arg "INSTALL_TORCH_VERSION=${INSTALL_TORCH_VERSION}" \
            --build-arg "DTK_INDEX_VERSION=${DTK_VERSION}" \
            --build-arg "DTK_PKG_NAME=${DTK_PACKAGE}" \
            --build-arg "DTK_PKG_VERSION=${DTK_PACKAGE_VERSION}" \
            --build-arg "DTK_VERSION=${DTK_VERSION}" \
            --build-arg "AICC_VERSION=${AICC_VERSION}" \
            --build-arg "LIGHTOP_SOURCE_BRANCH=${LIGHTOP_SOURCE_BRANCH}" \
            --build-arg "LIGHTOP_SOURCE_COMMIT=${LIGHTOP_SOURCE_COMMIT}" \
            --label "io.hygon.lightop.base-image=${CI_BASE_IMAGE}" \
            --label "io.hygon.lightop.dtk-package=${DTK_PACKAGE}" \
            --label "io.hygon.lightop.dtk-version=${DTK_VERSION}" \
            --label "io.hygon.lightop.aicc-version=${AICC_VERSION}" \
            --label "io.hygon.lightop.torch-version=${INSTALL_TORCH_VERSION}" \
            --label "io.hygon.lightop.source-branch=${LIGHTOP_SOURCE_BRANCH}" \
            --label "io.hygon.lightop.source-commit=${LIGHTOP_SOURCE_COMMIT}" \
            -t "${CI_COMPILE_IMAGE}" \
            "${CI_BUILD_CONTEXT}" 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'

          image_id="$(docker image inspect --format '{{.Id}}' "${CI_COMPILE_IMAGE}")"
          image_created="$(docker image inspect --format '{{.Created}}' "${CI_COMPILE_IMAGE}")"
          image_labels="$(docker image inspect --format '{{json .Config.Labels}}' "${CI_COMPILE_IMAGE}")"
          base_digest="$(docker image inspect --format '{{join .RepoDigests ", "}}' "${CI_BASE_IMAGE}")"

          echo "Built LightOp compile image:"
          echo "  base_image=${CI_BASE_IMAGE}"
          echo "  base_digest=${base_digest:-not provided}"
          echo "  compile_image=${CI_COMPILE_IMAGE}"
          echo "  image_id=${image_id}"
          echo "  created=${image_created}"
          echo "  labels=${image_labels:-not provided}"

          {
            echo "### LightOp daily compile environment"
            echo
            echo "- Base image: \`${CI_BASE_IMAGE}\`"
            echo "- Base digest: \`${base_digest:-not provided}\`"
            echo "- Compile image: \`${CI_COMPILE_IMAGE}\`"
            echo "- Compile image ID: \`${image_id}\`"
            echo "- Image created: \`${image_created}\`"
            echo "- DTK package: \`${DTK_PACKAGE}\`"
            echo "- DTK version: \`${DTK_VERSION}\`"
            echo "- AICC version: \`${AICC_VERSION}\`"
            echo "- Python: \`${PYTHON_VERSION}\`"
            echo "- Torch: \`${INSTALL_TORCH_VERSION}\`"
            echo "- Source branch: \`${LIGHTOP_SOURCE_BRANCH}\`"
            echo "- Integrated commit: \`${LIGHTOP_SOURCE_COMMIT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: "Build: Compile LightOp wheel"
        shell: bash
        run: |
          set -euo pipefail

          rocr_devices="${STATIC_ROCR_VISIBLE_DEVICES}"
          if [[ -z "${rocr_devices}" ]]; then
            echo "::error::No fixed HCU device is configured for this Torch lane."
            exit 1
          fi
          echo "Using fixed HCU device(s): ${rocr_devices}"
          echo "ROCR_VISIBLE_DEVICES=${rocr_devices}" >> "${GITHUB_ENV}"
          export ROCR_VISIBLE_DEVICES="${rocr_devices}"

          docker run -d \
            --name "${CI_COMPILE_CONTAINER_NAME}" \
            --init \
            --network host \
            --ipc host \
            --shm-size 80g \
            --cap-add SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --privileged \
            --device /dev/mkfd \
            --device /dev/kfd \
            --device /dev/dri \
            --group-add video \
            --user root \
            -e ROCR_VISIBLE_DEVICES \
            -e PYTHONUNBUFFERED \
            -v /opt/hyhal:/opt/hyhal:ro \
            "${CI_COMPILE_IMAGE}"

          set +e
          docker exec "${CI_COMPILE_CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            source /opt/dtk/env.sh
            source /lightop/.github/ci/configure-container-runtime.sh

            echo "LightOp compile environment:"
            python3 --version
            /opt/dtk/bin/hipcc --version
            hy-smi

            python3 - <<"PY"
          import importlib.metadata
          import numpy
          import torch

          print(f"torch={torch.__version__}")
          for package in ("numpy", "triton"):
              try:
                  print(f"{package}={importlib.metadata.version(package)}")
              except importlib.metadata.PackageNotFoundError:
                  print(f"{package}=not installed")
          print(f"device_available={torch.cuda.is_available()}")
          if not torch.cuda.is_available():
              raise SystemExit("No device is available to PyTorch")
          torch.from_numpy(numpy.zeros(1, dtype="float32")).numpy()
          torch_base_version = torch.__version__.split("+", 1)[0]
          expected_triton_tag = "torch" + torch_base_version.replace(".", "")
          triton_version = importlib.metadata.version("triton")
          if expected_triton_tag not in triton_version:
              raise SystemExit(
                  f"Triton {triton_version} does not match {torch.__version__}"
              )
          print("LightOp compile runtime is available.")
          PY

            /usr/local/bin/build-lightop-wheel
            python3 -c "import lightop; print(f\"lightop={lightop.__version__}\")"
          ' 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'
          compile_status=${PIPESTATUS[0]}
          set -e

          if [[ "${compile_status}" -ne 0 ]]; then
            echo "::error::LightOp compile container exited with status ${compile_status}."
            exit "${compile_status}"
          fi

          rm -rf dist
          mkdir -p dist
          docker cp "${CI_COMPILE_CONTAINER_NAME}:/dist/." dist/
          docker stop "${CI_COMPILE_CONTAINER_NAME}" >/dev/null

      - name: "Test: Run functional tests"
        id: functional_tests
        shell: bash
        run: |
          set -euo pipefail

          docker pull "${CI_TEST_IMAGE}" 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'
          test_image_id="$(docker image inspect --format '{{.Id}}' "${CI_TEST_IMAGE}")"
          test_image_created="$(docker image inspect --format '{{.Created}}' "${CI_TEST_IMAGE}")"
          echo "Using vLLM test image: ${CI_TEST_IMAGE}"
          echo "  image_id=${test_image_id}"
          echo "  created=${test_image_created}"
          {
            echo "### vLLM test environment"
            echo
            echo "- Torch lane: \`${INSTALL_TORCH_VERSION}\`"
            echo "- Test image: \`${CI_TEST_IMAGE}\`"
            echo "- Test image ID: \`${test_image_id}\`"
            echo "- Test image created: \`${test_image_created}\`"
            echo "- Expected vLLM: \`${EXPECTED_VLLM_VERSION}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          docker run -d \
            --name "${CI_TEST_CONTAINER_NAME}" \
            --label "io.hygon.lightop.torch-version=${INSTALL_TORCH_VERSION}" \
            --label "io.hygon.lightop.source-sha=${GITHUB_SHA}" \
            --label "io.hygon.lightop.test-image=${CI_TEST_IMAGE}" \
            --init \
            --network host \
            --ipc host \
            --shm-size 80g \
            --cap-add SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --privileged \
            --device /dev/mkfd \
            --device /dev/kfd \
            --device /dev/dri \
            --group-add video \
            --user root \
            -e ROCR_VISIBLE_DEVICES \
            -e PYTHONUNBUFFERED \
            -e INSTALL_TORCH_VERSION \
            -e EXPECTED_VLLM_VERSION \
            -v /opt/hyhal:/opt/hyhal:ro \
            "${CI_TEST_IMAGE}" \
            tail -f /dev/null

          docker exec "${CI_TEST_CONTAINER_NAME}" mkdir -p /ci_tests /dist /reports
          docker cp "${GITHUB_WORKSPACE}/test/ci_tests/." "${CI_TEST_CONTAINER_NAME}:/ci_tests/"
          docker cp "${GITHUB_WORKSPACE}/dist/." "${CI_TEST_CONTAINER_NAME}:/dist/"

          # The test image contains the matched vLLM/HCU stack.  Replace its
          # pre-installed LightOp package with this run's repaired wheel so
          # import and functional tests exercise the candidate artifact.
          docker exec "${CI_TEST_CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            source /opt/dtk/env.sh

            shopt -s nullglob
            wheels=(/dist/*manylinux*.whl)
            [[ "${#wheels[@]}" -eq 1 ]] || {
              echo "Expected exactly one repaired LightOp wheel, found ${#wheels[@]}"
              exit 1
            }
            python3 -m pip uninstall -y lightop || true
            python3 -m pip install --no-deps --force-reinstall "${wheels[0]}"
            cd /tmp
            python3 - <<"PY"
          import importlib.metadata
          import os
          import torch
          import triton
          import vllm
          import vllm._custom_ops
          import lightop

          torch_base = torch.__version__.split("+", 1)[0]
          lightop_version = importlib.metadata.version("lightop")
          expected_torch = os.environ["INSTALL_TORCH_VERSION"]
          expected_vllm = os.environ["EXPECTED_VLLM_VERSION"]
          vllm_base = vllm.__version__.split("+", 1)[0]
          if torch_base != expected_torch:
              raise SystemExit(
                  f"Test image Torch {torch.__version__} does not match "
                  f"{expected_torch}"
              )
          if vllm_base != expected_vllm:
              raise SystemExit(
                  f"Test image vLLM {vllm.__version__} does not match "
                  f"{expected_vllm}"
              )
          if not torch.cuda.is_available():
              raise SystemExit("No HCU device is available to PyTorch in the test image")
          print(f"torch={torch.__version__}")
          print(f"triton={triton.__version__}")
          print(f"vllm={vllm.__version__}")
          print(f"lightop={lightop_version}")
          print(f"tested wheel resolved from: {os.path.dirname(lightop.__file__)}")
          print("vLLM native extension and LightOp test runtime are available.")
          PY
          ' 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'

          echo "pytest_started=true" >> "${GITHUB_OUTPUT}"
          set +e
          docker exec "${CI_TEST_CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            source /opt/dtk/env.sh

            cd /ci_tests
            passed=()
            failed=()
            skipped=()
            for test_file in test_*.py; do
              if [[ "${test_file}" == "test_vllm_dependency_skips.py" ]]; then
                # This source placeholder represented the old Rocky 8 vLLM
                # limitation.  The pre-built test image is now verified above.
                echo "SKIPPED: ${test_file} (superseded by vLLM runtime validation)"
                skipped+=("${test_file}")
                continue
              fi
              echo "--- ${test_file} ---"
              if python3 "${test_file}"; then
                passed+=("${test_file}")
              else
                echo "ERROR: Functional test failed: ${test_file}"
                failed+=("${test_file}")
              fi
            done

            PASSED_TESTS="$(printf "%s\n" "${passed[@]:-}")" \
            FAILED_TESTS="$(printf "%s\n" "${failed[@]:-}")" \
            SKIPPED_TESTS="$(printf "%s\n" "${skipped[@]:-}")" \
            python3 - <<"PY"
          import os
          import xml.etree.ElementTree as ET

          def names(variable):
              return [name for name in os.environ.get(variable, "").splitlines() if name]

          passed = names("PASSED_TESTS")
          failed = names("FAILED_TESTS")
          skipped = names("SKIPPED_TESTS")
          suite = ET.Element(
              "testsuite",
              name="lightop.functional",
              tests=str(len(passed) + len(failed) + len(skipped)),
              failures=str(len(failed)),
              errors="0",
              skipped=str(len(skipped)),
          )
          for name in passed:
              ET.SubElement(suite, "testcase", classname="lightop.functional", name=name)
          for name in failed:
              case = ET.SubElement(suite, "testcase", classname="lightop.functional", name=name)
              ET.SubElement(case, "failure", message="Functional test program exited non-zero")
          for name in skipped:
              case = ET.SubElement(suite, "testcase", classname="lightop.functional", name=name)
              ET.SubElement(case, "skipped", message="Superseded by vLLM runtime validation")
          ET.ElementTree(suite).write(
              "/reports/lightop_test.xml", encoding="utf-8", xml_declaration=True
          )
          PY

            echo "Passed (${#passed[@]}): ${passed[*]:-none}"
            echo "Failed (${#failed[@]}): ${failed[*]:-none}"
            echo "Skipped (${#skipped[@]}): ${skipped[*]:-none}"
            [[ "${#failed[@]}" -eq 0 ]]
          ' 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'
          pytest_status=${PIPESTATUS[0]}
          set -e

          rm -f "${GITHUB_WORKSPACE}/lightop_test.xml"
          if ! docker cp \
              "${CI_TEST_CONTAINER_NAME}:/reports/lightop_test.xml" \
              "${GITHUB_WORKSPACE}/lightop_test.xml" 2>/dev/null; then
            echo "::warning::JUnit XML not produced by functional tests (exit ${pytest_status})."
          fi

          echo "pytest_status=${pytest_status}" >> "${GITHUB_OUTPUT}"

          case "${pytest_status}" in
            0) echo "All functional test programs passed." ;;
            1) echo "::warning::Some functional test programs failed. Report uploaded; job left green so admin can review and decide whether to merge." ;;
            *)
              echo "::error::Functional test runner failed with exit ${pytest_status}."
              exit "${pytest_status}"
              ;;
          esac

      - name: "Test: Summarize results"
        if: always() && steps.functional_tests.outputs.pytest_started == 'true'
        shell: bash
        env:
          PYTEST_STATUS: ${{ steps.functional_tests.outputs.pytest_status }}
        run: |
          set -euo pipefail
          xml="${GITHUB_WORKSPACE}/lightop_test.xml"
          {
            echo "### Functional tests"
            echo
            echo "- Torch: \`${INSTALL_TORCH_VERSION}\`"
            echo "- Runner exit: \`${PYTEST_STATUS:-unknown}\` (0=all pass, 1=some cases failed, other=runner failure)"
            echo
            if [[ ! -s "${xml}" ]]; then
              echo "_No JUnit report was produced._"
              exit 0
            fi
            python3 - "${xml}" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = root.findall('testsuite') if root.tag == 'testsuites' else [root]
          totals = {k: 0 for k in ('tests', 'failures', 'errors', 'skipped')}
          for s in suites:
              for k in totals:
                  totals[k] += int(s.attrib.get(k, 0))
          passed = totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']
          print("| Total | Passed | Failed | Errors | Skipped |")
          print("|------:|-------:|-------:|-------:|--------:|")
          print(f"| {totals['tests']} | {passed} | {totals['failures']} | {totals['errors']} | {totals['skipped']} |")
          bad = []
          for s in suites:
              for tc in s.findall('testcase'):
                  fail = tc.find('failure')
                  err = tc.find('error')
                  if fail is None and err is None:
                      continue
                  node = fail if fail is not None else err
                  first = (node.attrib.get('message') or (node.text or '')).splitlines()
                  first = first[0][:200] if first else ''
                  bad.append((tc.attrib.get('classname', ''), tc.attrib.get('name', ''), first))
          if bad:
              print()
              print("<details><summary>Failing test cases</summary>")
              print()
              print("| Test | First line of failure |")
              print("|------|-----------------------|")
              for cls, name, msg in bad:
                  full = f"{cls}::{name}" if cls else name
                  msg = msg.replace('|', '\\|')
                  print(f"| `{full}` | {msg} |")
              print()
              print("</details>")
          PY
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: "Test: Store JUnit report on runner"
        if: always() && steps.functional_tests.outputs.pytest_started == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${CI_NODE_OUTPUT_ROOT}/lightop/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/torch-${INSTALL_TORCH_VERSION}"
          case "${output_dir}" in
            "${CI_NODE_OUTPUT_ROOT}"/lightop/*/torch-*) ;;
            *)
              echo "::error::Unexpected node output directory: ${output_dir}"
              exit 1
              ;;
          esac
          mkdir -p "${output_dir}"
          test -w "${output_dir}"
          if [[ -s "${GITHUB_WORKSPACE}/lightop_test.xml" ]]; then
            install -m 0644 "${GITHUB_WORKSPACE}/lightop_test.xml" \
              "${output_dir}/lightop_test.xml"
            echo "Stored JUnit report: ${output_dir}/lightop_test.xml"
          else
            echo "::warning::No JUnit report is available to store."
          fi

      - name: Remove CI containers, images, and build context
        if: always()
        shell: bash
        run: |
          set +e
          docker rm -f "${CI_COMPILE_CONTAINER_NAME}" >/dev/null 2>&1

          docker rm -f "${CI_TEST_CONTAINER_NAME}" >/dev/null 2>&1

          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          docker run --rm \
            --user 0:0 \
            --entrypoint /bin/bash \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${CI_BASE_IMAGE}" \
            -lc '
              chown -R "$1:$2" /workspace
              chmod -R u+rwX /workspace
            ' _ "${runner_uid}" "${runner_gid}"

          docker image rm -f "${CI_COMPILE_IMAGE}" >/dev/null 2>&1
          if [[ "${CI_BUILD_CONTEXT:-}" == "${RUNNER_TEMP}"/lightop-build-* ]]; then
            rm -rf -- "${CI_BUILD_CONTEXT}"
          fi
          exit 0

      - name: "Package: Store validated wheel on runner"
        # Test-case failures leave the job green (see "Run functional tests"),
        # so the normal store runs. Guard with `success()` anyway to skip
        # storing when compile itself failed and dist/ is empty.
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${CI_NODE_OUTPUT_ROOT}/lightop/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/torch-${INSTALL_TORCH_VERSION}"
          case "${output_dir}" in
            "${CI_NODE_OUTPUT_ROOT}"/lightop/*/torch-*) ;;
            *)
              echo "::error::Unexpected node output directory: ${output_dir}"
              exit 1
              ;;
          esac
          mkdir -p "${output_dir}"
          test -w "${output_dir}"

          mapfile -d '' wheels < <(
            find "${GITHUB_WORKSPACE}/dist" -maxdepth 1 -type f \
              -name '*manylinux*.whl' -print0
          )
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one validated wheel, found ${#wheels[@]}."
            exit 1
          fi
          wheel_name="$(basename "${wheels[0]}")"
          install -m 0644 "${wheels[0]}" "${output_dir}/${wheel_name}"
          sha256sum "${output_dir}/${wheel_name}" > "${output_dir}/${wheel_name}.sha256"
          echo "Stored validated wheel: ${output_dir}/${wheel_name}"

  publish:
    name: Package and Publish (Torch ${{ matrix.torch_version }})
    needs:
      - prepare
      - test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_packages)
    runs-on: [self-hosted, Linux, X64, hcu-ci-pr, nmz36]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        torch_version: ${{ fromJSON(vars.LIGHTOP_TORCH_VERSIONS || '["2.10.0", "2.11.0"]') }}

    env:
      DTK_PKG_PATH: ${{ vars.LIGHTOP_DTK_PKG_PATH || 'http://10.16.1.201:8000/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz' }}
      PYTHON_INDEX_URL: ${{ vars.LIGHTOP_PYTHON_INDEX_URL || 'http://10.16.1.201:9929/nightly/dtk2604/+simple/' }}
      PYTHON_TRUSTED_HOST: ${{ vars.LIGHTOP_PYTHON_TRUSTED_HOST || '10.16.1.201' }}
      DEVPI_URL: ${{ vars.LIGHTOP_DEVPI_URL || 'http://10.16.1.201:9929/' }}
      DEVPI_USER: ${{ secrets.LIGHTOP_DEVPI_USER }}
      DEVPI_PASSWORD: ${{ secrets.LIGHTOP_DEVPI_PASSWORD }}
      CI_NODE_OUTPUT_ROOT: ${{ vars.LIGHTOP_CI_OUTPUT_ROOT || '/public/home/guochy1/guochy1/framework/workspace/logs' }}
      INSTALL_TORCH_VERSION: ${{ matrix.torch_version }}

    steps:
      - name: Locate validated wheel on runner
        id: publish_paths
        shell: bash
        run: |
          set -euo pipefail
          relative_dir="lightop/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/torch-${INSTALL_TORCH_VERSION}"
          preferred_dir="${CI_NODE_OUTPUT_ROOT}/${relative_dir}"
          fallback_dir="$(dirname "${GITHUB_WORKSPACE}")/.lightop-ci-outputs/${relative_dir}"
          if [[ -d "${preferred_dir}" && -r "${preferred_dir}" ]]; then
            artifact_dir="${preferred_dir}"
          elif [[ -d "${fallback_dir}" && -r "${fallback_dir}" ]]; then
            artifact_dir="${fallback_dir}"
          else
            echo "::error::Validated wheel directory was not found at ${preferred_dir} or ${fallback_dir}."
            exit 1
          fi
          echo "artifact_dir=${artifact_dir}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Publish validated repaired wheel
        shell: bash
        env:
          PUBLISH_ARTIFACT_DIR: ${{ steps.publish_paths.outputs.artifact_dir }}
        run: |
          set -euo pipefail
          if [[ -z "${DEVPI_USER}" || -z "${DEVPI_PASSWORD}" ]]; then
            echo "::error::Package repository credentials are not configured."
            exit 1
          fi
          echo "::add-mask::${DEVPI_PASSWORD}"

          mapfile -d '' wheels < <(
            find "${PUBLISH_ARTIFACT_DIR}" -type f -name '*manylinux*.whl' -print0
          )
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one validated repaired wheel, found ${#wheels[@]}."
            find "${PUBLISH_ARTIFACT_DIR}" -type f -printf '%P\n'
            exit 1
          fi

          wheel="${wheels[0]}"
          wheel_name="$(basename "${wheel}")"
          dtk_package="$(basename "${DTK_PKG_PATH}")"
          torch_tag="${INSTALL_TORCH_VERSION//./}"
          if [[ "${wheel_name}" != *".torch${torch_tag}."* ]]; then
            echo "::error::Wheel ${wheel_name} does not match Torch ${INSTALL_TORCH_VERSION}."
            exit 1
          fi
          sha256sum "${wheel}"

          python3 -m pip install \
            --index-url "${PYTHON_INDEX_URL}" \
            --trusted-host "${PYTHON_TRUSTED_HOST}" \
            ciupload
          CIUpload \
            --devpi_url "${DEVPI_URL}" \
            --devpi_user "${DEVPI_USER}" \
            --devpi_password "${DEVPI_PASSWORD}" \
            --dtk_pkg_name "${dtk_package}" \
            -f "${wheel}"
