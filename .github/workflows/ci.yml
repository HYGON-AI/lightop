name: LightOp CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish_packages:
        description: Publish validated wheels from this manual run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lightop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate integrated source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.integrate_source.outputs.target_sha }}

    steps:
      - name: Checkout LightOp
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Integrate latest target branch
        id: integrate_source
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.base_ref || 'master' }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse "origin/${TARGET_BRANCH}")"
          source_sha="$(git rev-parse HEAD)"
          git -c user.name='LightOp CI' -c user.email='ci@localhost' \
              merge --no-edit "${target_sha}"
          integrated_sha="$(git rev-parse HEAD)"
          echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Integrated LightOp source"
            echo
            echo "- Target branch: \`${TARGET_BRANCH}\`"
            echo "- Target commit: \`${target_sha}\`"
            echo "- Source commit: \`${source_sha}\`"
            echo "- Integrated commit: \`${integrated_sha}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check Python syntax
        run: python -m compileall -q python tools

      - name: Enforce public CI naming policy
        shell: bash
        run: |
          set -euo pipefail
          forbidden_pattern='[dD][cC][uU]'
          if git grep -IiqE "${forbidden_pattern}" -- .; then
            echo "::error::Tracked sources violate the public naming policy."
            exit 1
          fi

  test:
    name: Build and test with Torch ${{ matrix.torch_version }}
    needs: validate

    # Never execute code from an untrusted fork on an internal runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: [self-hosted, Linux, X64, hcu-ci-pr, nmz36]
    timeout-minutes: 240

    strategy:
      # A failure in one compatibility lane must not hide the result of the
      # other supported Torch version. Override the JSON array with the
      # LIGHTOP_TORCH_VERSIONS repository variable when needed.
      fail-fast: false
      matrix:
        torch_version: ${{ fromJSON(vars.LIGHTOP_TORCH_VERSIONS || '["2.10.0", "2.11.0"]') }}

    env:
      CI_BASE_IMAGE: ${{ vars.LIGHTOP_CI_BASE_IMAGE_REPOSITORY || '42.228.13.241:5000/dev/dev:rockylinux8.6-mpi5.0-gcc13.3-cmake3.29-py3.10-mkl2024.2.0.664' }}
      DTK_PKG_PATH: ${{ vars.LIGHTOP_DTK_PKG_PATH || 'http://10.16.1.201:8000/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz' }}
      AICC_NIGHTLY_DIR: /public/opendas/ArchivedFile/ai_cc/nightly
      # Only reached when the internal index cannot serve a dependency. Override
      # both together if the mirror is unreachable from the runner.
      FALLBACK_INDEX_URL: ${{ vars.LIGHTOP_FALLBACK_INDEX_URL || 'https://pypi.tuna.tsinghua.edu.cn/simple/' }}
      FALLBACK_INDEX_HOST: ${{ vars.LIGHTOP_FALLBACK_INDEX_HOST || 'pypi.tuna.tsinghua.edu.cn' }}
      PYTHON_VERSION: "3.10"
      CI_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      INSTALL_TORCH_VERSION: ${{ matrix.torch_version }}
      CI_COMPILE_IMAGE: lightop-ci:${{ github.run_id }}-${{ github.run_attempt }}-torch${{ matrix.torch_version }}
      CI_COMPILE_CONTAINER_NAME: lightop-build-${{ github.run_id }}-${{ github.run_attempt }}-torch${{ matrix.torch_version }}
      CISMI_TIMEOUT: ${{ vars.LIGHTOP_CISMI_TIMEOUT || '3600' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Repair workspace ownership before checkout
        shell: bash
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"

          docker pull "${CI_BASE_IMAGE}" 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'
          docker run --rm \
            --user 0:0 \
            --entrypoint /bin/bash \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${CI_BASE_IMAGE}" \
            -lc '
              chown -R "$1:$2" /workspace
              chmod -R u+rwX /workspace
            ' _ "${runner_uid}" "${runner_gid}"

      - name: Checkout LightOp
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Integrate latest target branch
        shell: bash
        env:
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: |
          set -euo pipefail
          git -c user.name='LightOp CI' -c user.email='ci@localhost' \
              merge --no-edit "${TARGET_SHA}"

      - name: Prepare runner and build context
        shell: bash
        run: |
          set -euo pipefail
          CI_BUILD_CONTEXT="${RUNNER_TEMP}/lightop-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-torch${INSTALL_TORCH_VERSION}"
          echo "CI_BUILD_CONTEXT=${CI_BUILD_CONTEXT}" >> "${GITHUB_ENV}"

          docker version
          test -e /dev/mkfd
          test -e /dev/kfd
          test -d /dev/dri
          test -x /opt/hyhal/bin/hy-smi
          test -d "${AICC_NIGHTLY_DIR}"
          ls -l /dev/mkfd /dev/kfd /dev/dri/*

          bash .github/ci/prepare-build-context.sh \
            "${CI_BUILD_CONTEXT}" \
            "${GITHUB_WORKSPACE}" \
            "${DTK_PKG_PATH}" \
            "${AICC_NIGHTLY_DIR}" \
            "${CI_SOURCE_BRANCH}"

          test ! -e "${CI_BUILD_CONTEXT}/lightop/.git"

      - name: Build daily LightOp compile image
        shell: bash
        run: |
          set -euo pipefail
          source "${CI_BUILD_CONTEXT}/build-environment.txt"

          docker build \
            --pull \
            --no-cache \
            --network host \
            --build-arg "BASE_IMAGE=${CI_BASE_IMAGE}" \
            --build-arg "PYTHON_VERSION=${PYTHON_VERSION}" \
            --build-arg "INSTALL_TORCH_VERSION=${INSTALL_TORCH_VERSION}" \
            --build-arg "DTK_INDEX_VERSION=${DTK_VERSION}" \
            --build-arg "FALLBACK_INDEX_URL=${FALLBACK_INDEX_URL}" \
            --build-arg "FALLBACK_INDEX_HOST=${FALLBACK_INDEX_HOST}" \
            --build-arg "DTK_PKG_NAME=${DTK_PACKAGE}" \
            --build-arg "DTK_PKG_VERSION=${DTK_PACKAGE_VERSION}" \
            --build-arg "DTK_VERSION=${DTK_VERSION}" \
            --build-arg "AICC_VERSION=${AICC_VERSION}" \
            --build-arg "LIGHTOP_SOURCE_BRANCH=${LIGHTOP_SOURCE_BRANCH}" \
            --build-arg "LIGHTOP_SOURCE_COMMIT=${LIGHTOP_SOURCE_COMMIT}" \
            --label "io.hygon.lightop.base-image=${CI_BASE_IMAGE}" \
            --label "io.hygon.lightop.dtk-package=${DTK_PACKAGE}" \
            --label "io.hygon.lightop.dtk-version=${DTK_VERSION}" \
            --label "io.hygon.lightop.aicc-version=${AICC_VERSION}" \
            --label "io.hygon.lightop.torch-version=${INSTALL_TORCH_VERSION}" \
            --label "io.hygon.lightop.source-branch=${LIGHTOP_SOURCE_BRANCH}" \
            --label "io.hygon.lightop.source-commit=${LIGHTOP_SOURCE_COMMIT}" \
            -t "${CI_COMPILE_IMAGE}" \
            "${CI_BUILD_CONTEXT}" 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'

          image_id="$(docker image inspect --format '{{.Id}}' "${CI_COMPILE_IMAGE}")"
          image_created="$(docker image inspect --format '{{.Created}}' "${CI_COMPILE_IMAGE}")"
          image_labels="$(docker image inspect --format '{{json .Config.Labels}}' "${CI_COMPILE_IMAGE}")"
          base_digest="$(docker image inspect --format '{{join .RepoDigests ", "}}' "${CI_BASE_IMAGE}")"

          echo "Built LightOp compile image:"
          echo "  base_image=${CI_BASE_IMAGE}"
          echo "  base_digest=${base_digest:-not provided}"
          echo "  compile_image=${CI_COMPILE_IMAGE}"
          echo "  image_id=${image_id}"
          echo "  created=${image_created}"
          echo "  labels=${image_labels:-not provided}"

          {
            echo "### LightOp daily compile environment"
            echo
            echo "- Base image: \`${CI_BASE_IMAGE}\`"
            echo "- Base digest: \`${base_digest:-not provided}\`"
            echo "- Compile image: \`${CI_COMPILE_IMAGE}\`"
            echo "- Compile image ID: \`${image_id}\`"
            echo "- Image created: \`${image_created}\`"
            echo "- DTK package: \`${DTK_PACKAGE}\`"
            echo "- DTK version: \`${DTK_VERSION}\`"
            echo "- AICC version: \`${AICC_VERSION}\`"
            echo "- Python: \`${PYTHON_VERSION}\`"
            echo "- Torch: \`${INSTALL_TORCH_VERSION}\`"
            echo "- Source branch: \`${LIGHTOP_SOURCE_BRANCH}\`"
            echo "- Integrated commit: \`${LIGHTOP_SOURCE_COMMIT}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install CIsmi
        shell: bash
        env:
          CISMI_INDEX_URL: ${{ vars.LIGHTOP_PYTHON_INDEX_URL || 'http://10.16.1.201:9929/nightly/dtk2604/+simple/' }}
          CISMI_TRUSTED_HOST: ${{ vars.LIGHTOP_PYTHON_TRUSTED_HOST || '10.16.1.201' }}
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet \
            --index-url "${CISMI_INDEX_URL}" \
            --trusted-host "${CISMI_TRUSTED_HOST}" \
            cismi
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Compile LightOp wheel
        shell: bash
        run: |
          set -euo pipefail

          hip_devices="$(CIsmi need 1 --timeout "${CISMI_TIMEOUT}")"
          if [[ -z "${hip_devices}" ]]; then
            echo "::error::CIsmi did not return any device within ${CISMI_TIMEOUT}s."
            exit 1
          fi
          echo "Allocated HCU: ${hip_devices}"
          echo "HIP_VISIBLE_DEVICES=${hip_devices}" >> "${GITHUB_ENV}"
          echo "ROCR_VISIBLE_DEVICES=${hip_devices}" >> "${GITHUB_ENV}"
          export HIP_VISIBLE_DEVICES="${hip_devices}"
          export ROCR_VISIBLE_DEVICES="${hip_devices}"

          docker run -d \
            --name "${CI_COMPILE_CONTAINER_NAME}" \
            --init \
            --network host \
            --ipc host \
            --shm-size 80g \
            --cap-add SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --privileged \
            --device /dev/mkfd \
            --device /dev/kfd \
            --device /dev/dri \
            --group-add video \
            --user root \
            -e HIP_VISIBLE_DEVICES \
            -e ROCR_VISIBLE_DEVICES \
            -e PYTHONUNBUFFERED \
            -v /opt/hyhal:/opt/hyhal:ro \
            "${CI_COMPILE_IMAGE}"

          set +e
          docker exec "${CI_COMPILE_CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            source /opt/dtk/env.sh
            export PATH="/opt/hyhal/bin:${PATH}"
            export LD_LIBRARY_PATH="/opt/hyhal/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"

            echo "LightOp compile environment:"
            python3 --version
            /opt/dtk/bin/hipcc --version
            hy-smi

            python3 - <<"PY"
          import importlib.metadata
          import torch

          print(f"torch={torch.__version__}")
          for package in ("numpy", "vllm"):
              try:
                  print(f"{package}={importlib.metadata.version(package)}")
              except importlib.metadata.PackageNotFoundError:
                  print(f"{package}=not installed")
          print(f"device_available={torch.cuda.is_available()}")
          if not torch.cuda.is_available():
              raise SystemExit("No device is available to PyTorch")
          PY

            /usr/local/bin/build-lightop-wheel
            python3 -c "import lightop; print(f\"lightop={lightop.__version__}\")"
          ' 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'
          compile_status=${PIPESTATUS[0]}
          set -e

          if [[ "${compile_status}" -ne 0 ]]; then
            echo "::error::LightOp compile container exited with status ${compile_status}."
            exit "${compile_status}"
          fi

          rm -rf dist
          mkdir -p dist
          docker cp "${CI_COMPILE_CONTAINER_NAME}:/dist/." dist/

      - name: Run functional tests
        id: functional_tests
        shell: bash
        run: |
          set -euo pipefail

          docker cp "${GITHUB_WORKSPACE}/test/ci_tests" "${CI_COMPILE_CONTAINER_NAME}:/ci_tests"
          docker exec "${CI_COMPILE_CONTAINER_NAME}" mkdir -p /reports

          set +e
          docker exec "${CI_COMPILE_CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            source /opt/dtk/env.sh
            export PATH="/opt/hyhal/bin:${PATH}"
            export LD_LIBRARY_PATH="/opt/hyhal/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"

            wheel_test_dir=$(mktemp -d)
            python3 -m pip uninstall -y lightop >/dev/null 2>&1 || true
            python3 -m pip install --no-deps --target "${wheel_test_dir}" /dist/*manylinux*.whl
            export PYTHONPATH="${wheel_test_dir}${PYTHONPATH:+:${PYTHONPATH}}"
            python3 -c "import lightop, os; print(f\"tested wheel resolved from: {os.path.dirname(lightop.__file__)}\")"

            python3 -m pytest /ci_tests \
              -v --tb=short \
              -o junit_family=xunit2 \
              --junitxml=/reports/lightop_test.xml \
              --continue-on-collection-errors
          ' 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'
          pytest_status=${PIPESTATUS[0]}
          set -e

          rm -f "${GITHUB_WORKSPACE}/lightop_test.xml"
          if ! docker cp \
              "${CI_COMPILE_CONTAINER_NAME}:/reports/lightop_test.xml" \
              "${GITHUB_WORKSPACE}/lightop_test.xml" 2>/dev/null; then
            echo "::warning::JUnit XML not produced by pytest (exit ${pytest_status})."
          fi

          echo "pytest_status=${pytest_status}" >> "${GITHUB_OUTPUT}"

          case "${pytest_status}" in
            0) echo "All test cases passed." ;;
            1) echo "::warning::Some test cases failed (pytest exit 1). Report uploaded; job left green so admin can review and decide whether to merge." ;;
            *)
              echo "::error::pytest itself failed with exit ${pytest_status} (not a test-case failure)."
              exit "${pytest_status}"
              ;;
          esac

      - name: Summarize test results
        if: always()
        shell: bash
        env:
          PYTEST_STATUS: ${{ steps.functional_tests.outputs.pytest_status }}
        run: |
          set -euo pipefail
          xml="${GITHUB_WORKSPACE}/lightop_test.xml"
          {
            echo "### Functional tests"
            echo
            echo "- Torch: \`${INSTALL_TORCH_VERSION}\`"
            echo "- pytest exit: \`${PYTEST_STATUS:-unknown}\` (0=all pass, 1=some cases failed, other=pytest itself crashed)"
            echo
            if [[ ! -s "${xml}" ]]; then
              echo "_No JUnit report was produced._"
              exit 0
            fi
            python3 - "${xml}" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = root.findall('testsuite') if root.tag == 'testsuites' else [root]
          totals = {k: 0 for k in ('tests', 'failures', 'errors', 'skipped')}
          for s in suites:
              for k in totals:
                  totals[k] += int(s.attrib.get(k, 0))
          passed = totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']
          print("| Total | Passed | Failed | Errors | Skipped |")
          print("|------:|-------:|-------:|-------:|--------:|")
          print(f"| {totals['tests']} | {passed} | {totals['failures']} | {totals['errors']} | {totals['skipped']} |")
          bad = []
          for s in suites:
              for tc in s.findall('testcase'):
                  fail = tc.find('failure')
                  err = tc.find('error')
                  if fail is None and err is None:
                      continue
                  node = fail if fail is not None else err
                  first = (node.attrib.get('message') or (node.text or '')).splitlines()
                  first = first[0][:200] if first else ''
                  bad.append((tc.attrib.get('classname', ''), tc.attrib.get('name', ''), first))
          if bad:
              print()
              print("<details><summary>Failing test cases</summary>")
              print()
              print("| Test | First line of failure |")
              print("|------|-----------------------|")
              for cls, name, msg in bad:
                  full = f"{cls}::{name}" if cls else name
                  msg = msg.replace('|', '\\|')
                  print(f"| `{full}` | {msg} |")
              print()
              print("</details>")
          PY
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightop-test-report-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}-torch-${{ matrix.torch_version }}
          path: lightop_test.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Remove CI containers, images, and build context
        if: always()
        shell: bash
        run: |
          set +e
          docker rm -f "${CI_COMPILE_CONTAINER_NAME}" >/dev/null 2>&1

          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          docker run --rm \
            --user 0:0 \
            --entrypoint /bin/bash \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${CI_BASE_IMAGE}" \
            -lc '
              chown -R "$1:$2" /workspace
              chmod -R u+rwX /workspace
            ' _ "${runner_uid}" "${runner_gid}"

          docker image rm -f "${CI_COMPILE_IMAGE}" >/dev/null 2>&1
          if [[ "${CI_BUILD_CONTEXT:-}" == "${RUNNER_TEMP}"/lightop-build-* ]]; then
            rm -rf -- "${CI_BUILD_CONTEXT}"
          fi
          exit 0

      - name: Upload validated build artifacts
        # Test-case failures leave the job green (see "Run functional tests"),
        # so the normal upload runs. Guard with `success()` anyway to skip
        # uploading when compile itself failed and dist/ is empty.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lightop-ci-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}-torch-${{ matrix.torch_version }}
          path: dist/*manylinux*.whl
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish wheel for Torch ${{ matrix.torch_version }}
    needs:
      - validate
      - test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_packages)
    runs-on: [self-hosted, Linux, X64, hcu-ci-pr, nmz36]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        torch_version: ${{ fromJSON(vars.LIGHTOP_TORCH_VERSIONS || '["2.10.0", "2.11.0"]') }}

    env:
      DTK_PKG_PATH: ${{ vars.LIGHTOP_DTK_PKG_PATH || 'http://10.16.1.201:8000/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz' }}
      PYTHON_INDEX_URL: ${{ vars.LIGHTOP_PYTHON_INDEX_URL || 'http://10.16.1.201:9929/nightly/dtk2604/+simple/' }}
      PYTHON_TRUSTED_HOST: ${{ vars.LIGHTOP_PYTHON_TRUSTED_HOST || '10.16.1.201' }}
      DEVPI_URL: ${{ vars.LIGHTOP_DEVPI_URL || 'http://10.16.1.201:9929/' }}
      DEVPI_USER: ${{ secrets.LIGHTOP_DEVPI_USER }}
      DEVPI_PASSWORD: ${{ secrets.LIGHTOP_DEVPI_PASSWORD }}
      INSTALL_TORCH_VERSION: ${{ matrix.torch_version }}

    steps:
      - name: Prepare artifact download directory
        id: publish_paths
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/lightop-publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-torch-${INSTALL_TORCH_VERSION}"
          case "${artifact_dir}" in
            "${RUNNER_TEMP}"/lightop-publish-*) ;;
            *)
              echo "::error::Refusing to reset unexpected artifact directory: ${artifact_dir}"
              exit 1
              ;;
          esac
          rm -rf -- "${artifact_dir}"
          mkdir -p -- "${artifact_dir}"
          echo "artifact_dir=${artifact_dir}" >> "${GITHUB_OUTPUT}"

      - name: Download validated wheel
        uses: actions/download-artifact@v4
        with:
          name: lightop-ci-${{ github.run_id }}-${{ github.run_attempt }}-torch-${{ matrix.torch_version }}
          path: ${{ steps.publish_paths.outputs.artifact_dir }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Publish validated repaired wheel
        shell: bash
        env:
          PUBLISH_ARTIFACT_DIR: ${{ steps.publish_paths.outputs.artifact_dir }}
        run: |
          set -euo pipefail
          if [[ -z "${DEVPI_USER}" || -z "${DEVPI_PASSWORD}" ]]; then
            echo "::error::Package repository credentials are not configured."
            exit 1
          fi
          echo "::add-mask::${DEVPI_PASSWORD}"

          mapfile -d '' wheels < <(
            find "${PUBLISH_ARTIFACT_DIR}" -type f -name '*manylinux*.whl' -print0
          )
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one validated repaired wheel, found ${#wheels[@]}."
            find "${PUBLISH_ARTIFACT_DIR}" -type f -printf '%P\n'
            exit 1
          fi

          wheel="${wheels[0]}"
          wheel_name="$(basename "${wheel}")"
          dtk_package="$(basename "${DTK_PKG_PATH}")"
          torch_tag="${INSTALL_TORCH_VERSION//./}"
          if [[ "${wheel_name}" != *".torch${torch_tag}."* ]]; then
            echo "::error::Wheel ${wheel_name} does not match Torch ${INSTALL_TORCH_VERSION}."
            exit 1
          fi
          sha256sum "${wheel}"

          python3 -m pip install \
            --index-url "${PYTHON_INDEX_URL}" \
            --trusted-host "${PYTHON_TRUSTED_HOST}" \
            ciupload
          CIUpload \
            --devpi_url "${DEVPI_URL}" \
            --devpi_user "${DEVPI_USER}" \
            --devpi_password "${DEVPI_PASSWORD}" \
            --dtk_pkg_name "${dtk_package}" \
            -f "${wheel}"

      - name: Remove downloaded publish artifact
        if: always()
        shell: bash
        env:
          PUBLISH_ARTIFACT_DIR: ${{ steps.publish_paths.outputs.artifact_dir }}
        run: |
          set -euo pipefail
          case "${PUBLISH_ARTIFACT_DIR}" in
            "${RUNNER_TEMP}"/lightop-publish-*)
              rm -rf -- "${PUBLISH_ARTIFACT_DIR}"
              ;;
            *)
              echo "::warning::Skipped cleanup of unexpected artifact directory: ${PUBLISH_ARTIFACT_DIR}"
              ;;
          esac
