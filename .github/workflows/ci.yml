name: LightOp CI

on:
  pull_request:
    branches:
      - master
      - lightop-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and test configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout LightOp
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check Python syntax
        run: python -m compileall -q python tools

      - name: Enforce public CI naming policy
        shell: bash
        run: |
          set -euo pipefail
          forbidden_pattern='[dD][cC][uU]'
          if grep -RIqE "${forbidden_pattern}" .github docs/GITHUB_ACTIONS_CI.md; then
            echo "::error::CI sources violate the public naming policy."
            exit 1
          fi

  test:
    name: Build LightOp environment and run OpTest
    needs: validate

    # Never execute code from an untrusted fork on an internal runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: [self-hosted, Linux, X64, hcu-ci-pr, nmz36]
    timeout-minutes: 240

    env:
      WORKSPACE_HELPER_IMAGE: 42.228.13.241:5000/dev/dev:rockylinux8.6-mpi5.0-gcc13.3-cmake3.29-py3.10-mkl2024.2.0.664
      CI_BASE_IMAGE_REPOSITORY: 42.228.13.241:5000/dev/dev
      DTK_PACKAGE_BASE_URL: http://10.16.1.201:8000/dtk-pkg/dtk26.04
      AICC_NIGHTLY_DIR: /public/opendas/ArchivedFile/ai_cc/nightly
      PYTHON_INDEX_URL: http://10.16.1.201:9929/nightly/dtk2604/+simple/
      PYTHON_TRUSTED_HOST: 10.16.1.201
      DTK_PACKAGE: DTK-26.04-rc4-centos8-x86_64.tar.gz
      PYTHON_VERSION: "3.10"
      INSTALL_TORCH_VERSION: "2.10.0"
      INSTALL_VLLM_VERSION: "0.15.1"
      INSTALL_TRITON_VERSION: "3.5.1"
      INSTALL_NUMPY_VERSION: "1.25.0"
      OPTEST_PACKAGE_SPEC: optest
      CI_COMPILE_IMAGE: lightop-ci:${{ github.run_id }}-${{ github.run_attempt }}
      CI_COMPILE_CONTAINER_NAME: lightop-build-${{ github.run_id }}-${{ github.run_attempt }}
      CI_TEST_CONTAINER_NAME: lightop-test-${{ github.run_id }}-${{ github.run_attempt }}
      CI_ARTIFACT_ROOT: ${{ github.workspace }}/.ci-artifacts/${{ github.run_id }}-${{ github.run_attempt }}
      HIP_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
      ROCR_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Validate trusted CI configuration
        shell: bash
        run: |
          set -euo pipefail

          required_values=(
            WORKSPACE_HELPER_IMAGE CI_BASE_IMAGE_REPOSITORY DTK_PACKAGE_BASE_URL
            PYTHON_INDEX_URL PYTHON_TRUSTED_HOST
          )
          for name in "${required_values[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required CI setting ${name} is not configured."
              exit 2
            fi
          done

          for name in DTK_PACKAGE_BASE_URL PYTHON_INDEX_URL; do
            if [[ ! "${!name}" =~ ^https?:// ]]; then
              echo "::error::${name} must use HTTP or HTTPS."
              exit 2
            fi
          done
          if [[ ! "${WORKSPACE_HELPER_IMAGE}" =~ :[A-Za-z0-9][A-Za-z0-9._+!-]*$ ]]; then
            echo "::error::The workspace helper image must use an explicit version tag."
            exit 2
          fi

          forbidden_pattern='[dD][cC][uU]'
          for name in "${required_values[@]}"; do
            if [[ "${!name}" =~ ${forbidden_pattern} ]]; then
              echo "::error::CI setting ${name} violates the public-log naming policy."
              exit 2
            fi
          done

      - name: Repair workspace ownership before checkout
        shell: bash
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"

          docker pull "${WORKSPACE_HELPER_IMAGE}" 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'
          docker run --rm \
            --user 0:0 \
            --entrypoint /bin/bash \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${WORKSPACE_HELPER_IMAGE}" \
            -lc '
              chown -R "$1:$2" /workspace
              chmod -R u+rwX /workspace
            ' _ "${runner_uid}" "${runner_gid}"

      - name: Checkout LightOp
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve current CI inputs and prepare build context
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t base_digests < <(
            docker image inspect \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' \
              "${WORKSPACE_HELPER_IMAGE}" |
              awk -v repository="${CI_BASE_IMAGE_REPOSITORY}" \
                'index($0, repository "@sha256:") == 1 {print $0}' |
              sort -u
          )
          if [[ "${#base_digests[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one digest for the configured base image."
            exit 1
          fi
          CI_BASE_IMAGE="${base_digests[0]}"
          DTK_PKG_URL="${DTK_PACKAGE_BASE_URL%/}/${DTK_PACKAGE}"
          AICC_PACKAGE="$(
            find "${AICC_NIGHTLY_DIR}" -maxdepth 1 -type f -name 'dtk_llvm_*.run' -printf '%f\n' |
              sed 's/\.run$//' |
              sort -t '_' -k4 -nr |
              sed -n '1p'
          ).run"
          if [[ "${AICC_PACKAGE}" == ".run" || ! -f "${AICC_NIGHTLY_DIR}/${AICC_PACKAGE}" ]]; then
            echo "::error::No valid compiler package candidate was found."
            exit 1
          fi
          echo "CI_BASE_IMAGE=${CI_BASE_IMAGE}" >> "${GITHUB_ENV}"
          echo "DTK_PKG_URL=${DTK_PKG_URL}" >> "${GITHUB_ENV}"
          echo "AICC_PACKAGE=${AICC_PACKAGE}" >> "${GITHUB_ENV}"
          CI_BUILD_CONTEXT="${RUNNER_TEMP}/lightop-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CI_BUILD_CONTEXT=${CI_BUILD_CONTEXT}" >> "${GITHUB_ENV}"

          docker version
          test -e /dev/mkfd
          test -e /dev/kfd
          test -d /dev/dri
          test -x /opt/hyhal/bin/hy-smi
          test -d "${AICC_NIGHTLY_DIR}"
          ls -l /dev/mkfd /dev/kfd /dev/dri/*

          mkdir -p \
            "${CI_ARTIFACT_ROOT}/op_test_output" \
            "${CI_ARTIFACT_ROOT}/op_test_log"

          bash .github/ci/prepare-build-context.sh \
            "${CI_BUILD_CONTEXT}" \
            "${GITHUB_WORKSPACE}" \
            "${DTK_PKG_URL}" \
            "${AICC_NIGHTLY_DIR}" \
            "${AICC_PACKAGE}"

      - name: Build daily LightOp compile image
        shell: bash
        run: |
          set -euo pipefail
          source "${CI_BUILD_CONTEXT}/build-environment.txt"

          docker build \
            --pull \
            --no-cache \
            --network host \
            --build-arg "PYTHON_VERSION=${PYTHON_VERSION}" \
            --build-arg "BASE_IMAGE=${CI_BASE_IMAGE}" \
            --build-arg "INSTALL_TORCH_VERSION=${INSTALL_TORCH_VERSION}" \
            --build-arg "PYTHON_INDEX_URL=${PYTHON_INDEX_URL}" \
            --build-arg "PYTHON_TRUSTED_HOST=${PYTHON_TRUSTED_HOST}" \
            --build-arg "DTK_PKG_NAME=${DTK_PACKAGE}" \
            --build-arg "DTK_PKG_VERSION=${DTK_PACKAGE_VERSION}" \
            --build-arg "DTK_VERSION=${DTK_VERSION}" \
            --build-arg "AICC_VERSION=${AICC_VERSION}" \
            --label "io.hygon.lightop.base-image=${CI_BASE_IMAGE}" \
            --label "io.hygon.lightop.dtk-package=${DTK_PACKAGE}" \
            --label "io.hygon.lightop.dtk-version=${DTK_VERSION}" \
            --label "io.hygon.lightop.aicc-version=${AICC_VERSION}" \
            --label "io.hygon.lightop.torch-version=${INSTALL_TORCH_VERSION}" \
            --label "io.hygon.lightop.source-commit=${GITHUB_SHA}" \
            -t "${CI_COMPILE_IMAGE}" \
            "${CI_BUILD_CONTEXT}" 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'

          image_id="$(docker image inspect --format '{{.Id}}' "${CI_COMPILE_IMAGE}")"
          image_created="$(docker image inspect --format '{{.Created}}' "${CI_COMPILE_IMAGE}")"
          image_labels="$(docker image inspect --format '{{json .Config.Labels}}' "${CI_COMPILE_IMAGE}")"
          base_digest="$(docker image inspect --format '{{join .RepoDigests ", "}}' "${CI_BASE_IMAGE}")"

          echo "Built LightOp compile image:"
          echo "  base_image=${CI_BASE_IMAGE}"
          echo "  base_digest=${base_digest:-not provided}"
          echo "  compile_image=${CI_COMPILE_IMAGE}"
          echo "  image_id=${image_id}"
          echo "  created=${image_created}"
          echo "  labels=${image_labels:-not provided}"

          {
            echo "### LightOp daily compile environment"
            echo
            echo "- Base image: \`${CI_BASE_IMAGE}\`"
            echo "- Base digest: \`${base_digest:-not provided}\`"
            echo "- Compile image: \`${CI_COMPILE_IMAGE}\`"
            echo "- Compile image ID: \`${image_id}\`"
            echo "- Image created: \`${image_created}\`"
            echo "- DTK package: \`${DTK_PACKAGE}\`"
            echo "- DTK version: \`${DTK_VERSION}\`"
            echo "- DTK SHA-256: \`${DTK_PACKAGE_SHA256}\`"
            echo "- AICC version: \`${AICC_VERSION}\`"
            echo "- AICC SHA-256: \`${AICC_PACKAGE_SHA256}\`"
            echo "- Python: \`${PYTHON_VERSION}\`"
            echo "- Torch: \`${INSTALL_TORCH_VERSION}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Compile LightOp wheel
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name "${CI_COMPILE_CONTAINER_NAME}" \
            --init \
            --network host \
            --ipc host \
            --shm-size 80g \
            --cap-add SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --privileged \
            --device /dev/mkfd \
            --device /dev/kfd \
            --device /dev/dri \
            --group-add video \
            --user root \
            -e HIP_VISIBLE_DEVICES \
            -e ROCR_VISIBLE_DEVICES \
            -e PYTHONUNBUFFERED \
            -e "LIGHTOP_SOURCE_COMMIT=${GITHUB_SHA}" \
            -v /opt/hyhal:/opt/hyhal:ro \
            "${CI_COMPILE_IMAGE}"

          set +e
          docker exec "${CI_COMPILE_CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            source /opt/dtk/env.sh
            export PATH="/opt/hyhal/bin:${PATH}"
            export LD_LIBRARY_PATH="/opt/hyhal/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"

            echo "LightOp compile environment:"
            python3 --version
            /opt/dtk/bin/hipcc --version
            hy-smi

            python3 - <<"PY"
          import importlib.metadata
          import torch

          print(f"torch={torch.__version__}")
          for package in ("numpy", "cupy"):
              try:
                  print(f"{package}={importlib.metadata.version(package)}")
              except importlib.metadata.PackageNotFoundError:
                  print(f"{package}=not installed")
          print(f"device_available={torch.cuda.is_available()}")
          if not torch.cuda.is_available():
              raise SystemExit("No device is available to PyTorch")
          PY

            /usr/local/bin/build-lightop-wheel
          ' 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'
          compile_status=${PIPESTATUS[0]}
          set -e

          rm -rf dist
          mkdir -p dist
          docker cp "${CI_COMPILE_CONTAINER_NAME}:/dist/." dist/ || true

          if [[ "${compile_status}" -ne 0 ]]; then
            echo "::error::LightOp compile container exited with status ${compile_status}."
            exit "${compile_status}"
          fi

      - name: Run OpTest in a fresh test container
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name "${CI_TEST_CONTAINER_NAME}" \
            --init \
            --network host \
            --ipc host \
            --shm-size 80g \
            --cap-add SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --privileged \
            --device /dev/mkfd \
            --device /dev/kfd \
            --device /dev/dri \
            --group-add video \
            --user root \
            -e HIP_VISIBLE_DEVICES \
            -e ROCR_VISIBLE_DEVICES \
            -e OPTEST_PACKAGE_SPEC \
            -e PYTHON_INDEX_URL \
            -e PYTHON_TRUSTED_HOST \
            -e INSTALL_TORCH_VERSION \
            -e INSTALL_VLLM_VERSION \
            -e INSTALL_TRITON_VERSION \
            -e INSTALL_NUMPY_VERSION \
            -e PYTHONUNBUFFERED \
            -v /opt/hyhal:/opt/hyhal:ro \
            -v "${GITHUB_WORKSPACE}/dist:/ci-dist:ro" \
            -v "${CI_ARTIFACT_ROOT}/op_test_output:/op_test_output" \
            -v "${CI_ARTIFACT_ROOT}/op_test_log:/op_test_log" \
            "${CI_COMPILE_IMAGE}"

          docker exec "${CI_TEST_CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            source /opt/dtk/env.sh
            export PATH="/opt/hyhal/bin:${PATH}"
            export LD_LIBRARY_PATH="/opt/hyhal/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"

            mapfile -t wheels < <(find /ci-dist -maxdepth 1 -type f -name "*.whl" -print)
            if [[ "${#wheels[@]}" -ne 1 ]]; then
              echo "Expected exactly one repaired wheel, found ${#wheels[@]}" >&2
              exit 1
            fi
            python3 -m pip install --force-reinstall --no-deps "${wheels[0]}"
            cd /tmp
            python3 -c "import lightop; print(f\"lightop={lightop.__version__}\")"

            # OpTest is installed without dependencies so its NumPy 1.24 pin
            # cannot mutate the already validated LightOp build runtime.
            python3 -m pip install \
              pytest-timeout openpyxl pandas einops tqdm tabulate
            python3 -m pip install \
              --disable-pip-version-check \
              --no-deps \
              --index-url "${PYTHON_INDEX_URL}" \
              --trusted-host "${PYTHON_TRUSTED_HOST}" \
              "${OPTEST_PACKAGE_SPEC}"

            python3 -m optest --help

            # Both OpTest and the repository fallback suite require the same
            # test runtime used by the existing LightOp validation flow.
            # Match the established LightOp environment setup: install the
            # vLLM dependency set first, then restore the selected Torch and
            # Triton runtime in separate resolver transactions.
            python3 -m pip install \
              "vllm==${INSTALL_VLLM_VERSION}"
            python3 -m pip install \
              "torch==${INSTALL_TORCH_VERSION}" \
              "triton==${INSTALL_TRITON_VERSION}"
            python3 -m pip install "numpy==${INSTALL_NUMPY_VERSION}"
            python3 -m pip uninstall -y cupy-cuda12x

            python3 - <<"PY"
          import importlib.metadata
          import torch
          from vllm import _custom_ops  # noqa: F401
          from vllm import _C  # noqa: F401

          print(f"torch={torch.__version__}")
          for package in ("vllm", "triton", "numpy", "optest"):
              print(f"{package}={importlib.metadata.version(package)}")
          if not torch.cuda.is_available():
              raise SystemExit("No device is available to PyTorch")
          PY

            if python3 - <<"PY"
          from optest.operators import SUPPORTED_OPERATORS
          raise SystemExit(0 if "lightop" in SUPPORTED_OPERATORS else 1)
          PY
            then
              echo "OpTest supports LightOp; only OpTest will execute tests."
              printf "optest\n" > /op_test_output/ci-test-driver.txt

              python3 -m optest \
                --op_name lightop \
                --test_mode acc \
                --test_dir /lightop \
                --gpus "${HIP_VISIBLE_DEVICES}"
            else
              echo "The resolved OpTest package does not support LightOp; running the repository fallback suite."
              printf "repository-fallback\n" > /op_test_output/ci-test-driver.txt
              /usr/local/bin/run-lightop-fallback-tests /lightop
            fi
          ' 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'

      - name: Remove CI containers, images, and build context
        if: always()
        shell: bash
        run: |
          set +e
          docker rm -f "${CI_TEST_CONTAINER_NAME}" >/dev/null 2>&1
          docker rm -f "${CI_COMPILE_CONTAINER_NAME}" >/dev/null 2>&1

          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          docker run --rm \
            --user 0:0 \
            --entrypoint /bin/bash \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${WORKSPACE_HELPER_IMAGE}" \
            -lc '
              chown -R "$1:$2" /workspace
              chmod -R u+rwX /workspace
            ' _ "${runner_uid}" "${runner_gid}"

          docker image rm -f "${CI_COMPILE_IMAGE}" >/dev/null 2>&1
          docker image rm -f "${CI_BASE_IMAGE}" >/dev/null 2>&1
          if [[ "${CI_BUILD_CONTEXT:-}" == "${RUNNER_TEMP}"/lightop-build-* ]]; then
            rm -rf -- "${CI_BUILD_CONTEXT}"
          fi
          exit 0

      - name: Enforce public artifact naming policy
        id: artifact_policy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          forbidden_pattern='[dD][cC][uU]'
          if find dist .ci-artifacts -mindepth 1 -print 2>/dev/null | grep -Eiq "${forbidden_pattern}"; then
            echo "::error::A generated artifact path violates the public-log naming policy."
            exit 1
          fi
          if grep -RIaqE --exclude='*.whl' "${forbidden_pattern}" dist .ci-artifacts 2>/dev/null; then
            echo "::error::A generated artifact violates the public-log naming policy."
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import BadZipFile, ZipFile

          forbidden = bytes.fromhex("646375")
          text_suffixes = {
              ".cfg", ".cmake", ".cpp", ".cu", ".cuh", ".h", ".hpp", ".json",
              ".md", ".py", ".sh", ".toml", ".txt", ".yaml", ".yml",
          }
          metadata_names = {"METADATA", "RECORD", "WHEEL", "entry_points.txt", "top_level.txt"}
          for wheel in Path("dist").glob("*.whl"):
              try:
                  with ZipFile(wheel) as archive:
                      for member in archive.infolist():
                          if forbidden in member.filename.lower().encode("utf-8"):
                              raise SystemExit("A wheel member path violates the public-log naming policy.")
                          member_path = Path(member.filename)
                          is_text = member_path.suffix.lower() in text_suffixes or member_path.name in metadata_names
                          if is_text and forbidden in archive.read(member).lower():
                              raise SystemExit("Wheel content violates the public-log naming policy.")
              except BadZipFile as exc:
                  raise SystemExit(f"Invalid wheel archive: {wheel.name}") from exc
          PY

      - name: Upload build and test artifacts
        if: always() && steps.artifact_policy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lightop-ci-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.whl
            .ci-artifacts/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
