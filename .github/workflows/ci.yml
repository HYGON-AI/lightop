name: LightOp CI

on:
  pull_request:
    branches:
      - master
      - lightop-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and test configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.integrate_source.outputs.base_sha }}

    steps:
      - name: Checkout LightOp
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Integrate latest master
        id: integrate_source
        shell: bash
        run: bash .github/ci/integrate-latest-master.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check Python syntax
        run: python -m compileall -q python tools

      - name: Enforce public CI naming policy
        shell: bash
        run: |
          set -euo pipefail
          forbidden_pattern='[dD][cC][uU]'
          if git grep -IiqE "${forbidden_pattern}" -- .; then
            echo "::error::Tracked sources violate the public naming policy."
            exit 1
          fi

  test:
    name: Build and test with Torch ${{ matrix.torch_version }}
    needs: validate

    # Never execute code from an untrusted fork on an internal runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: [self-hosted, Linux, X64, hcu-ci-pr, nmz36]
    timeout-minutes: 240

    strategy:
      # A failure in one compatibility lane must not hide the result of the
      # other supported Torch version. Override the JSON array with the
      # LIGHTOP_TORCH_VERSIONS repository variable when needed.
      fail-fast: false
      matrix:
        torch_version: ${{ fromJSON(vars.LIGHTOP_TORCH_VERSIONS || '["2.10.0", "2.11.0"]') }}

    env:
      CI_BASE_IMAGE: 42.228.13.241:5000/dev/dev:rockylinux8.6-mpi5.0-gcc13.3-cmake3.29-py3.10-mkl2024.2.0.664
      DTK_PKG_PATH: ${{ vars.LIGHTOP_DTK_PKG_PATH || 'http://10.16.1.201:8000/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz' }}
      AICC_NIGHTLY_DIR: /public/opendas/ArchivedFile/ai_cc/nightly
      PYTHON_VERSION: "3.10"
      CI_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      INSTALL_TORCH_VERSION: ${{ matrix.torch_version }}
      DTK_INDEX_VERSION: "2604"
      CI_COMPILE_IMAGE: lightop-ci:${{ github.run_id }}-${{ github.run_attempt }}-torch${{ matrix.torch_version }}
      CI_COMPILE_CONTAINER_NAME: lightop-build-${{ github.run_id }}-${{ github.run_attempt }}-torch${{ matrix.torch_version }}
      CI_TEST_IMAGE: lightop-test-ci:${{ github.run_id }}-${{ github.run_attempt }}-torch${{ matrix.torch_version }}
      CI_TEST_CONTAINER_NAME: lightop-test-${{ github.run_id }}-${{ github.run_attempt }}-torch${{ matrix.torch_version }}
      CI_ARTIFACT_ROOT: ${{ github.workspace }}/.ci-artifacts/${{ github.run_id }}-${{ github.run_attempt }}/torch-${{ matrix.torch_version }}
      HIP_VISIBLE_DEVICES: ${{ vars.LIGHTOP_CI_GPUS || '0' }}
      ROCR_VISIBLE_DEVICES: ${{ vars.LIGHTOP_CI_GPUS || '0' }}
      OPTEST_PACKAGE_SPEC: ${{ vars.OPTEST_PACKAGE_SPEC || 'optest' }}
      OPTEST_INDEX_URL: ${{ vars.OPTEST_INDEX_URL || 'http://10.16.1.201:9929/nightly/dtk2604/+simple/' }}
      OPTEST_TRUSTED_HOST: ${{ vars.OPTEST_TRUSTED_HOST || '10.16.1.201' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Repair workspace ownership before checkout
        shell: bash
        run: |
          set -euo pipefail
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"

          docker pull "${CI_BASE_IMAGE}" 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'
          docker run --rm \
            --user 0:0 \
            --entrypoint /bin/bash \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${CI_BASE_IMAGE}" \
            -lc '
              chown -R "$1:$2" /workspace
              chmod -R u+rwX /workspace
            ' _ "${runner_uid}" "${runner_gid}"

      - name: Checkout LightOp
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Integrate latest master
        shell: bash
        run: bash .github/ci/integrate-latest-master.sh "${{ needs.validate.outputs.base_sha }}"

      - name: Prepare runner and build context
        shell: bash
        run: |
          set -euo pipefail
          CI_BUILD_CONTEXT="${RUNNER_TEMP}/lightop-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-torch${INSTALL_TORCH_VERSION}"
          echo "CI_BUILD_CONTEXT=${CI_BUILD_CONTEXT}" >> "${GITHUB_ENV}"

          docker version
          test -e /dev/mkfd
          test -e /dev/kfd
          test -d /dev/dri
          test -x /opt/hyhal/bin/hy-smi
          test -d "${AICC_NIGHTLY_DIR}"
          ls -l /dev/mkfd /dev/kfd /dev/dri/*

          mkdir -p \
            "${CI_ARTIFACT_ROOT}/op_test_output" \
            "${CI_ARTIFACT_ROOT}/op_test_log"

          bash .github/ci/prepare-build-context.sh \
            "${CI_BUILD_CONTEXT}" \
            "${GITHUB_WORKSPACE}" \
            "${DTK_PKG_PATH}" \
            "${AICC_NIGHTLY_DIR}" \
            "${CI_SOURCE_BRANCH}"

      - name: Build daily LightOp compile image
        shell: bash
        run: |
          set -euo pipefail
          source "${CI_BUILD_CONTEXT}/build-environment.txt"

          docker build \
            --pull \
            --no-cache \
            --network host \
            --build-arg "BASE_IMAGE=${CI_BASE_IMAGE}" \
            --build-arg "PYTHON_VERSION=${PYTHON_VERSION}" \
            --build-arg "INSTALL_TORCH_VERSION=${INSTALL_TORCH_VERSION}" \
            --build-arg "DTK_INDEX_VERSION=${DTK_INDEX_VERSION}" \
            --build-arg "DTK_PKG_NAME=${DTK_PACKAGE}" \
            --build-arg "DTK_PKG_VERSION=${DTK_PACKAGE_VERSION}" \
            --build-arg "DTK_VERSION=${DTK_VERSION}" \
            --build-arg "AICC_VERSION=${AICC_VERSION}" \
            --label "io.hygon.lightop.base-image=${CI_BASE_IMAGE}" \
            --label "io.hygon.lightop.dtk-package=${DTK_PACKAGE}" \
            --label "io.hygon.lightop.dtk-version=${DTK_VERSION}" \
            --label "io.hygon.lightop.aicc-version=${AICC_VERSION}" \
            --label "io.hygon.lightop.torch-version=${INSTALL_TORCH_VERSION}" \
            --label "io.hygon.lightop.source-commit=${GITHUB_SHA}" \
            -t "${CI_COMPILE_IMAGE}" \
            "${CI_BUILD_CONTEXT}" 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'

          image_id="$(docker image inspect --format '{{.Id}}' "${CI_COMPILE_IMAGE}")"
          image_created="$(docker image inspect --format '{{.Created}}' "${CI_COMPILE_IMAGE}")"
          image_labels="$(docker image inspect --format '{{json .Config.Labels}}' "${CI_COMPILE_IMAGE}")"
          base_digest="$(docker image inspect --format '{{join .RepoDigests ", "}}' "${CI_BASE_IMAGE}")"

          echo "Built LightOp compile image:"
          echo "  base_image=${CI_BASE_IMAGE}"
          echo "  base_digest=${base_digest:-not provided}"
          echo "  compile_image=${CI_COMPILE_IMAGE}"
          echo "  image_id=${image_id}"
          echo "  created=${image_created}"
          echo "  labels=${image_labels:-not provided}"

          {
            echo "### LightOp daily compile environment"
            echo
            echo "- Base image: \`${CI_BASE_IMAGE}\`"
            echo "- Base digest: \`${base_digest:-not provided}\`"
            echo "- Compile image: \`${CI_COMPILE_IMAGE}\`"
            echo "- Compile image ID: \`${image_id}\`"
            echo "- Image created: \`${image_created}\`"
            echo "- DTK package: \`${DTK_PACKAGE}\`"
            echo "- DTK version: \`${DTK_VERSION}\`"
            echo "- AICC version: \`${AICC_VERSION}\`"
            echo "- Python: \`${PYTHON_VERSION}\`"
            echo "- Torch: \`${INSTALL_TORCH_VERSION}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Compile LightOp wheel
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name "${CI_COMPILE_CONTAINER_NAME}" \
            --init \
            --network host \
            --ipc host \
            --shm-size 80g \
            --cap-add SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --privileged \
            --device /dev/mkfd \
            --device /dev/kfd \
            --device /dev/dri \
            --group-add video \
            --user root \
            -e HIP_VISIBLE_DEVICES \
            -e ROCR_VISIBLE_DEVICES \
            -e PYTHONUNBUFFERED \
            -v /opt/hyhal:/opt/hyhal:ro \
            "${CI_COMPILE_IMAGE}"

          set +e
          docker exec "${CI_COMPILE_CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            source /opt/dtk/env.sh
            export PATH="/opt/hyhal/bin:${PATH}"
            export LD_LIBRARY_PATH="/opt/hyhal/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"

            echo "LightOp compile environment:"
            python3 --version
            /opt/dtk/bin/hipcc --version
            hy-smi

            python3 - <<"PY"
          import importlib.metadata
          import torch

          print(f"torch={torch.__version__}")
          for package in ("numpy", "cupy"):
              try:
                  print(f"{package}={importlib.metadata.version(package)}")
              except importlib.metadata.PackageNotFoundError:
                  print(f"{package}=not installed")
          print(f"device_available={torch.cuda.is_available()}")
          if not torch.cuda.is_available():
              raise SystemExit("No device is available to PyTorch")
          PY

            /usr/local/bin/build-lightop-wheel
            python3 -c "import lightop; print(f\"lightop={lightop.__version__}\")"
          ' 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'
          compile_status=${PIPESTATUS[0]}
          set -e

          rm -rf dist
          mkdir -p dist
          docker cp "${CI_COMPILE_CONTAINER_NAME}:/dist/." dist/ || true

          if [[ "${compile_status}" -ne 0 ]]; then
            echo "::error::LightOp compile container exited with status ${compile_status}."
            exit "${compile_status}"
          fi

          # Like CIctl's docker commit after COMPILE: preserve the installed
          # LightOp wheel in an immutable image for a fresh test container.
          docker commit \
            --change 'CMD ["tail", "-f", "/dev/null"]' \
            "${CI_COMPILE_CONTAINER_NAME}" \
            "${CI_TEST_IMAGE}"

      - name: Run OpTest in a fresh test container
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name "${CI_TEST_CONTAINER_NAME}" \
            --init \
            --network host \
            --ipc host \
            --shm-size 80g \
            --cap-add SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --privileged \
            --device /dev/mkfd \
            --device /dev/kfd \
            --device /dev/dri \
            --group-add video \
            --user root \
            -e HIP_VISIBLE_DEVICES \
            -e ROCR_VISIBLE_DEVICES \
            -e OPTEST_PACKAGE_SPEC \
            -e OPTEST_INDEX_URL \
            -e OPTEST_TRUSTED_HOST \
            -e INSTALL_TORCH_VERSION \
            -e PYTHONUNBUFFERED \
            -v /opt/hyhal:/opt/hyhal:ro \
            -v "${CI_ARTIFACT_ROOT}/op_test_output:/op_test_output" \
            -v "${CI_ARTIFACT_ROOT}/op_test_log:/op_test_log" \
            "${CI_TEST_IMAGE}"

          docker exec "${CI_TEST_CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            source /opt/dtk/env.sh
            export PATH="/opt/hyhal/bin:${PATH}"
            export LD_LIBRARY_PATH="/opt/hyhal/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"

            # OpTest is installed without dependencies so its NumPy 1.24 pin
            # cannot mutate the already validated LightOp build runtime.
            python3 -m pip install \
              pytest-timeout openpyxl pandas einops tqdm tabulate
            python3 -m pip install \
              --disable-pip-version-check \
              --no-deps \
              --index-url "${OPTEST_INDEX_URL}" \
              --trusted-host "${OPTEST_TRUSTED_HOST}" \
              "${OPTEST_PACKAGE_SPEC}"

            python3 -m optest --help
            if python3 - <<"PY"
          from optest.operators import SUPPORTED_OPERATORS
          raise SystemExit(0 if "lightop" in SUPPORTED_OPERATORS else 1)
          PY
            then
              echo "OpTest supports LightOp; only OpTest will execute tests."
              printf "optest\n" > /op_test_output/ci-test-driver.txt

              # Resolve the matching runtime as one transaction. This lets
              # the package index choose a build compatible with each Torch
              # matrix lane instead of coupling CI to one Torch release.
              python3 -m pip install \
                "torch==${INSTALL_TORCH_VERSION}" \
                vllm \
                triton
              python3 -m pip install "numpy==1.25.0"
              python3 -m pip uninstall -y cupy-cuda12x

              python3 - <<"PY"
          import importlib.metadata
          import os
          import torch
          from vllm import _custom_ops  # noqa: F401

          expected_torch = os.environ["INSTALL_TORCH_VERSION"]
          actual_torch = torch.__version__.split("+", 1)[0]
          if actual_torch != expected_torch:
              raise SystemExit(
                  f"Torch version mismatch after test dependency install: "
                  f"expected {expected_torch}, got {torch.__version__}"
              )

          print(f"torch={torch.__version__}")
          for package in ("vllm", "triton", "numpy", "optest"):
              print(f"{package}={importlib.metadata.version(package)}")
          if not torch.cuda.is_available():
              raise SystemExit("No device is available to PyTorch")
          PY

              python3 -m optest \
                --op_name lightop \
                --test_mode acc \
                --test_dir /lightop \
                --gpus "${HIP_VISIBLE_DEVICES}"
            else
              echo "::warning::Installed OpTest does not support LightOp yet; compilation and wheel validation succeeded, so tests are skipped."
              printf "optest-not-supported\n" > /op_test_output/ci-test-driver.txt
            fi
          ' 2>&1 | sed -E 's/[dD][cC][uU]/HCU/g'

      - name: Remove CI containers, images, and build context
        if: always()
        shell: bash
        run: |
          set +e
          docker rm -f "${CI_TEST_CONTAINER_NAME}" >/dev/null 2>&1
          docker rm -f "${CI_COMPILE_CONTAINER_NAME}" >/dev/null 2>&1

          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          docker run --rm \
            --user 0:0 \
            --entrypoint /bin/bash \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${CI_BASE_IMAGE}" \
            -lc '
              chown -R "$1:$2" /workspace
              chmod -R u+rwX /workspace
            ' _ "${runner_uid}" "${runner_gid}"

          docker image rm -f "${CI_TEST_IMAGE}" >/dev/null 2>&1
          docker image rm -f "${CI_COMPILE_IMAGE}" >/dev/null 2>&1
          docker image rm -f "${CI_BASE_IMAGE}" >/dev/null 2>&1
          if [[ "${CI_BUILD_CONTEXT:-}" == "${RUNNER_TEMP}"/lightop-build-* ]]; then
            rm -rf -- "${CI_BUILD_CONTEXT}"
          fi
          exit 0

      - name: Sanitize public text logs
        id: artifact_policy
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          forbidden_pattern='[dD][cC][uU]'
          if [[ -d .ci-artifacts ]]; then
            while IFS= read -r -d '' artifact_file; do
              if grep -Iq . "${artifact_file}"; then
                sed -i -E 's/[dD][cC][uU]/HCU/g' "${artifact_file}"
              fi
            done < <(find .ci-artifacts -type f -print0)

            if find .ci-artifacts -mindepth 1 -print | grep -Eiq "${forbidden_pattern}"; then
              echo "::error::An artifact path violates the public naming policy."
              exit 1
            fi
            if grep -RIaqE "${forbidden_pattern}" .ci-artifacts; then
              echo "::error::An artifact still violates the public naming policy."
              exit 1
            fi
          fi

      - name: Upload build and test artifacts
        if: always() && steps.artifact_policy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lightop-ci-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt }}-torch-${{ matrix.torch_version }}
          path: |
            dist/*.whl
            .ci-artifacts/${{ github.run_id }}-${{ github.run_attempt }}/torch-${{ matrix.torch_version }}/
          if-no-files-found: warn
          retention-days: 14
